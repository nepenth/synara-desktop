[package]
name = "tauri-matrix-sdk-compat"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
description = "Isolated P0.5 coexistence probe: Tauri 2.11 + matrix-sdk/matrix-sdk-ui 0.18.0 on Rust 1.93"
license = "AGPL-3.0-only"

[dependencies]
# Align major/minor with production src-tauri (tauri 2.11.x).
# Keep tray/image extras off; default features include wry (needed for AppHandle<Wry>).
# Not a full Tauri app shell — compile/link coexistence only.
tauri = { version = "2.11" }

# Exact pins match probes/matrix-rust-sdk-0.18 and desktop 0.18.0 program pin.
# default-features = false mirrors the API-shape probe; e2e may still unify via
# matrix-sdk-ui's dependency on matrix-sdk with feature "e2e-encryption".
matrix-sdk = { version = "=0.18.0", default-features = false }
matrix-sdk-ui = { version = "=0.18.0", default-features = false }

[lib]
name = "tauri_matrix_sdk_compat"
path = "src/lib.rs"
