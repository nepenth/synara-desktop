[package]
publish.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
name = "synara-core"
# Domain harnesses share links and test workers; explicit targets retain isolation
# for the authorized live proof and feature-gated index tests.
autotests = false
version = "0.1.0"
description = "Transport-agnostic shared native core for Synara (desktop + iOS)"
license.workspace = true
edition.workspace = true

# P4-1: Apple shells link the same project-owned library; no prebuilt Matrix
# wrapper is used for this binding surface.
[lib]
# Apple generators explicitly request staticlib; ordinary builds/tests emit rlib only.
crate-type = ["lib"]

[features]
default = ["full-uniffi"]
# Shared desktop/iOS owners and their SDK capabilities. NSE retains only the
# notification, client/store/lifecycle, and privacy-policy boundary below.
full-app = [
  "matrix-sdk/markdown",
  "matrix-sdk/qrcode",
  "matrix-sdk/unstable-msc4426",
  "matrix-sdk/experimental-widgets",
  "dep:reqwest",
  "dep:ruma",
  "dep:eyeball-im",
  "dep:futures-util",
  "dep:mime",
  "dep:hmac",
]
# Apple adds its binding surface explicitly; desktop opts out of the default
# so it never compiles UniFFI runtime/scaffolding or exports Apple symbols.
full-uniffi = ["full-app", "dep:uniffi"]
nse-preview = []
# matrix-sdk `automatic-room-key-forwarding` is deliberately not compiled on any
# graph. Forwarded Megolm keys are unauthenticated (no sender proof), so every
# client recovers history from the encrypted key backup instead, as Element X does.
# Desktop-only local message index (matrix-sdk-search / Tantivy). NSE and iOS
# SharedCore must not enable this; they keep Client-Server `/search`.
search-index = ["full-app", "matrix-sdk/experimental-search"]
# Desktop-only. Do not enable on nse-preview / iOS SharedCore graphs.
x509-identity = [
  "full-app",
  "matrix-sdk/experimental-x509-identity-verification",
  "matrix-sdk-crypto/experimental-x509-identity-verification",
  "matrix-sdk-crypto/rust-x509-verifier-impl",
  "dep:rustls",
]

[dependencies]
# P1.4 domain DTOs (moved from src-tauri/matrix/dto, SNC-P1-2) derive serde.
serde = { workspace = true, features = ["derive"] }
# P1.3 transport protocol (moved from src-tauri/matrix/ipc, SNC-P1-3): stream_body
# validates JSON bodies at the envelope boundary; tests share the fixtures too.
serde_json = { workspace = true }
# URL parser for fail-closed homeserver base validation.
url = { workspace = true }
# Credential-free login-flow discovery transport (moved from desktop auth).
reqwest = { workspace = true, features = ["rustls", "http2", "stream"], optional = true }
# SNC-P1-4: task registry (moved from src-tauri/matrix/tasks) supervises async
# work — tokio spawn/JoinHandle at runtime and the test macro for its unit tests.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
# SNC-P1-5a + live client open: sync and Client::builder live in this crate.
# Workspace pins disable SDK default features. sqlite + bundled-sqlite
# are required here because build_unauthenticated_client opens the product store.
# rustls-aws-lc-rs is required with default-features=false (0.19.0 rustls provider).
# Full-app capabilities (Markdown, QR and widgets) belong to `full-app`.
# Encrypted state stays common: NSE reads the same crypto/store format and
# must resolve notifications for existing encrypted-state rooms.
# E2E is explicit so the client's encryption contract does not depend on UI
# feature unification. NSE never enables automatic room-key forwarding.
matrix-sdk = { workspace = true, features = [
  "sqlite",
  "bundled-sqlite",
  "rustls-aws-lc-rs",
  "e2e-encryption",
  "experimental-encrypted-state-events",
] }
matrix-sdk-ui = { workspace = true, features = [
  "rustls-aws-lc-rs",
  "experimental-encrypted-state-events",
] }
# Live NativeTimelineRegistry maps UTD causes from the crypto crate.
# The workspace disables SDK crypto default features, including
# automatic-room-key-forwarding, which no Synara graph compiles.
matrix-sdk-crypto = { workspace = true }
# Password re-login peeks the leftover SQLite crypto account so the next login
# reuses that device id. Pin and default-features match the SDK workspace.
matrix-sdk-sqlite = { workspace = true, features = [
  "crypto-store",
] }
# Typed SQLite codes distinguish proven corruption from unavailable/wrong keys.
rusqlite = { workspace = true }
# Feature-unifies Ruma's Matrix-spec HTML sanitizer with the SDK re-export.
# Outbound composer Markdown is parsed and sanitized in one shared boundary.
ruma = { workspace = true, features = ["html", "markdown"], optional = true }
# SNC-P1-5b: room_list (moved from src-tauri/matrix/room_list) — live.rs streams
# room-list vector diffs (eyeball-im) asynchronously (futures-util).
eyeball-im = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
# SNC-P1-5b: invite_avatars.rs mints opaque random bearer handles for
# invite-card avatar media sources (getrandom::fill).
getrandom = { workspace = true }
# P4-1 binding metadata/runtime. The version is pinned so the UDL scaffolding,
# generated Swift, and Apple libraries are produced by one reproducible toolchain.
uniffi = { workspace = true, features = ["tokio"], optional = true }
# Store identity fingerprints directory names (moved from desktop store/identity.rs).
sha2 = { workspace = true }
# Timeline media handles: HMAC of (session generation, media source) under a
# per-process secret, so revisits reuse URLs and handles stay unguessable.
hmac = { workspace = true, optional = true }
# Host-only register token buffers (moved with live register orchestration).
zeroize = { workspace = true }
# Avatar MIME parsing for upload_avatar (bytes stay off Core JSON).
mime = { workspace = true, optional = true }
# Optional: desktop `x509-identity` installs aws-lc as the rustls process
# default so HTTPS and `RustRawX509Verifier` share one provider. The verifier
# crate also enables rustls `ring`; we never install ring as default.
rustls = { workspace = true, features = [
  "std",
  "aws_lc_rs",
  "tls12",
], optional = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"], optional = true }

[dev-dependencies]
# dto/tests.rs fixture + serde round-trip tests.
serde_json = { workspace = true }
# Timeline sequencing contract tests drive the pinned SDK's real timeline and
# feed its emitted VectorDiff batches through Synara's production projector.
matrix-sdk = { workspace = true, features = [
  "testing",
  "sqlite",
  "bundled-sqlite",
  "rustls-aws-lc-rs",
  "markdown",
  "experimental-widgets",
  "experimental-encrypted-state-events",
] }
matrix-sdk-test = { workspace = true }
# Exercise public device-key publication against the real SDK HTTP transport.
wiremock = "0.6"

[[test]]
name = "indexed_message_search"
path = "tests/indexed_message_search.rs"
required-features = ["search-index"]

# Root integration sources are included by the domain harnesses. The coverage
# guard in uniffi_async_bridge rejects orphaned or multiply registered sources.

[[test]]
name = "ffi_lifecycle"
path = "tests/suites/ffi_lifecycle.rs"
required-features = ["full-uniffi"]

[[test]]
name = "ffi_accounts_rooms"
path = "tests/suites/ffi_accounts_rooms.rs"
required-features = ["full-uniffi"]

[[test]]
name = "ffi_messaging"
path = "tests/suites/ffi_messaging.rs"
required-features = ["full-uniffi"]

[[test]]
name = "sdk_behaviors"
path = "tests/suites/sdk_behaviors.rs"
required-features = ["full-uniffi"]

[[test]]
name = "live_device_eligibility"
path = "tests/live_device_eligibility.rs"
required-features = ["full-uniffi"]

[[test]]
name = "uniffi_async_bridge"
path = "tests/uniffi_async_bridge.rs"
