[package]
name = "synara-core"
version = "0.1.0"
description = "Transport-agnostic shared native core for Synara (desktop + iOS)"
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
# P1.4 domain DTOs (moved from src-tauri/matrix/dto, SNC-P1-2) derive serde.
serde = { version = "1.0.193", features = ["derive"] }
# P1.3 transport protocol (moved from src-tauri/matrix/ipc, SNC-P1-3): stream_body
# validates JSON bodies at the envelope boundary; tests share the fixtures too.
serde_json = "1.0.109"
# SNC-P1-4: task registry (moved from src-tauri/matrix/tasks) supervises async
# work — tokio spawn/JoinHandle at runtime and the test macro for its unit tests.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
# SNC-P1-5a: sync (moved from src-tauri/matrix/sync) drives matrix-sdk-ui
# SyncService against a matrix-sdk Client. Pins are EXACTLY what src-tauri uses
# (=0.18.0, default-features=false); the desktop's extra matrix-sdk features
# (sqlite/bundled-sqlite/markdown/qrcode) remain src-tauri concerns — feature
# unification covers them when the desktop graph builds this crate, and the
# moved sync code needs only the base Client API plus matrix-sdk-ui's own
# e2e-encryption feature edge (which matrix-sdk-ui pulls in itself).
matrix-sdk = { version = "=0.18.0", default-features = false }
matrix-sdk-ui = { version = "=0.18.0", default-features = false }

[dev-dependencies]
# dto/tests.rs fixture + serde round-trip tests.
serde_json = "1.0.109"
