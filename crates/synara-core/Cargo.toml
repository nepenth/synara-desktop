[package]
publish.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
name = "synara-core"
version = "0.1.0"
description = "Transport-agnostic shared native core for Synara (desktop + iOS)"
license.workspace = true
edition.workspace = true

# P4-1: Apple shells link the same project-owned library; no prebuilt Matrix
# wrapper is used for this binding surface.
[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = ["full-uniffi"]
# Desktop and iOS full-app compile in automatic Megolm gossip. NSE must not:
# NotificationClient restores the crypto store and must not answer key requests.
full-uniffi = ["room-key-forwarding"]
nse-preview = []
# matrix-sdk 0.19 GossipMachine defaults both serve and request switches on
# once this cfg is compiled. Encryption has no public setter; product stays
# always-on. Do not put this feature on nse-preview.
room-key-forwarding = [
  "matrix-sdk/automatic-room-key-forwarding",
  "matrix-sdk-crypto/automatic-room-key-forwarding",
]
# Desktop-only local message index (matrix-sdk-search / Tantivy). NSE and iOS
# SharedCore must not enable this; they keep Client-Server `/search`.
search-index = ["matrix-sdk/experimental-search"]
# Desktop-only. Do not enable on nse-preview / iOS SharedCore graphs.
x509-identity = [
  "matrix-sdk/experimental-x509-identity-verification",
  "matrix-sdk-crypto/experimental-x509-identity-verification",
  "matrix-sdk-crypto/rust-x509-verifier-impl",
  "dep:rustls",
]

[dependencies]
# P1.4 domain DTOs (moved from src-tauri/matrix/dto, SNC-P1-2) derive serde.
serde = { workspace = true, features = ["derive"] }
# P1.3 transport protocol (moved from src-tauri/matrix/ipc, SNC-P1-3): stream_body
# validates JSON bodies at the envelope boundary; tests share the fixtures too.
serde_json = { workspace = true }
# URL parser for fail-closed homeserver base validation.
url = { workspace = true }
# Credential-free login-flow discovery transport (moved from desktop auth).
reqwest = { workspace = true, features = ["rustls", "http2", "stream"] }
# SNC-P1-4: task registry (moved from src-tauri/matrix/tasks) supervises async
# work — tokio spawn/JoinHandle at runtime and the test macro for its unit tests.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
# SNC-P1-5a + live client open: sync and Client::builder live in this crate.
# Workspace pins disable SDK default features. sqlite + bundled-sqlite
# are required here because build_unauthenticated_client opens the product store.
# rustls-aws-lc-rs is required with default-features=false (0.19.0 rustls provider).
# Markdown is shared for Matrix-compatible rich composer output. QR verification
# (show-code) is a stable matrix-sdk feature, already enabled on desktop; Core
# enables it so NativeVerificationOwner can generate a code in tests and iOS.
# E2E encryption still arrives via matrix-sdk-ui. automatic-room-key-forwarding
# is *not* listed here: NSE builds this dependency without the Core
# `room-key-forwarding` feature. experimental-widgets is a compile pin for the
# experimental host; do not add experimental-send-custom-to-device (transitive).
matrix-sdk = { workspace = true, features = [
  "sqlite",
  "bundled-sqlite",
  "rustls-aws-lc-rs",
  "markdown",
  "qrcode",
  "unstable-msc4426",
  "experimental-widgets",
  "experimental-encrypted-state-events",
] }
matrix-sdk-ui = { workspace = true, features = [
  "rustls-aws-lc-rs",
  "experimental-encrypted-state-events",
] }
# Live NativeTimelineRegistry maps UTD causes from the crypto crate.
# The workspace disables SDK crypto default features. The
# automatic-room-key-forwarding cfg is enabled only via the Core
# `room-key-forwarding` feature (not here), so NSE stays off.
matrix-sdk-crypto = { workspace = true }
# Password re-login peeks the leftover SQLite crypto account so the next login
# reuses that device id. Pin and default-features match the SDK workspace.
matrix-sdk-sqlite = { workspace = true, features = [
  "crypto-store",
] }
# Feature-unifies Ruma's Matrix-spec HTML sanitizer with the SDK re-export.
# Outbound composer Markdown is parsed and sanitized in one shared boundary.
ruma = { workspace = true, features = ["html", "markdown"] }
# SNC-P1-5b: room_list (moved from src-tauri/matrix/room_list) — live.rs streams
# room-list vector diffs (eyeball-im) asynchronously (futures-util).
eyeball-im = { workspace = true }
futures-util = { workspace = true }
# SNC-P1-5b: invite_avatars.rs mints opaque random bearer handles for
# invite-card avatar media sources (getrandom::fill).
getrandom = { workspace = true }
# P4-1 binding metadata/runtime. The version is pinned so the UDL scaffolding,
# generated Swift, and Apple libraries are produced by one reproducible toolchain.
uniffi = { workspace = true, features = ["tokio"] }
# Store identity fingerprints directory names (moved from desktop store/identity.rs).
sha2 = { workspace = true }
# Host-only register token buffers (moved with live register orchestration).
zeroize = { workspace = true }
# Avatar MIME parsing for upload_avatar (bytes stay off Core JSON).
mime = { workspace = true }
# Optional: desktop `x509-identity` installs aws-lc as the rustls process
# default so HTTPS and `RustRawX509Verifier` share one provider. The verifier
# crate also enables rustls `ring`; we never install ring as default.
rustls = { workspace = true, features = [
  "std",
  "aws_lc_rs",
  "tls12",
], optional = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
# dto/tests.rs fixture + serde round-trip tests.
serde_json = { workspace = true }
# Timeline sequencing contract tests drive the pinned SDK's real timeline and
# feed its emitted VectorDiff batches through Synara's production projector.
matrix-sdk = { workspace = true, features = [
  "testing",
  "sqlite",
  "bundled-sqlite",
  "rustls-aws-lc-rs",
  "markdown",
  "experimental-widgets",
  "experimental-encrypted-state-events",
] }
matrix-sdk-test = { workspace = true }
# Exercise public device-key publication against the real SDK HTTP transport.
wiremock = "0.6"

[[test]]
name = "indexed_message_search"
path = "tests/indexed_message_search.rs"
required-features = ["search-index"]
