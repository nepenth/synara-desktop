[package]
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
name = "synara-nse-core"
version = "0.1.0"
description = "Notification-extension-only bindings for the Synara native core"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
synara-core = { path = "../synara-core", default-features = false, features = ["nse-preview"] }
tokio = { workspace = true, features = ["macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
uniffi = { workspace = true, features = ["tokio"] }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
# Live fixture setup alone uses the normal product login/sync owner. The
# shipping extension dependency above remains explicitly narrow.
synara-core = { path = "../synara-core", features = ["full-uniffi"] }
url = { workspace = true }
