name: Synara
options:
  bundleIdPrefix: com.whylandcreative.synara
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "1.1.9"
packages:
  MatrixRustComponentsSwift:
    url: https://github.com/matrix-org/matrix-rust-components-swift.git
    exactVersion: 26.05.13
targets:
  Synara:
    type: application
    platform: iOS
    sources:
      - path: Synara
    dependencies:
      - package: MatrixRustComponentsSwift
        product: MatrixRustSDK
    info:
      path: Synara/App/Info.plist
      properties:
        CFBundleDisplayName: Synara
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.whylandcreative.synara
            CFBundleURLSchemes:
              - synara
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Synara/Resources/Synara.entitlements
        DEVELOPMENT_TEAM: ABC123DEFG
        PRODUCT_BUNDLE_IDENTIFIER: com.whylandcreative.synara
        PRODUCT_NAME: Synara
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: Synara Matrix App Store
  SynaraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SynaraTests
    dependencies:
      - target: Synara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whylandcreative.synara.tests
        CODE_SIGNING_ALLOWED: "NO"
  SynaraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SynaraUITests
    dependencies:
      - target: Synara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whylandcreative.synara.uitests
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  Synara:
    build:
      targets:
        Synara: all
    test:
      targets:
        - SynaraTests
        - SynaraUITests
      gatherCoverageData: false
    run:
      config: Debug
