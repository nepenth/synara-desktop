name: Synara
options:
  bundleIdPrefix: com.whylandcreative.synara
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.1.4"
    CURRENT_PROJECT_VERSION: "2.1.4"
packages:
  SynaraCore:
    path: SynaraCore
  MatrixRustComponentsSwift:
    url: https://github.com/matrix-org/matrix-rust-components-swift.git
    exactVersion: 26.06.06
targets:
  Synara:
    type: application
    platform: iOS
    sources:
      - path: Synara
      - path: SynaraShared
    dependencies:
      - package: SynaraCore
        product: SynaraCore
      - package: MatrixRustComponentsSwift
        product: MatrixRustSDK
      - target: SynaraNotificationService
        embed: true
    info:
      path: Synara/App/Info.plist
      properties:
        CFBundleDisplayName: Synara
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.whylandcreative.synara
            CFBundleURLSchemes:
              - synara
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        NSCameraUsageDescription: Synara needs camera access to capture photos and videos for messages.
        SynaraPushGatewayURL: "$(SYNARA_PUSH_GATEWAY_URL)"
        SynaraKeychainAccessGroup: "$(AppIdentifierPrefix)com.whylandcreative.synara.shared"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Synara/Resources/Synara.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.whylandcreative.synara
        PRODUCT_NAME: Synara
        SYNARA_PUSH_GATEWAY_URL: ""
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: "$(SYNARA_IOS_PROVISIONING_PROFILE)"
  SynaraNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: SynaraNotificationService
      - path: SynaraShared
    info:
      path: SynaraNotificationService/Info.plist
      properties:
        CFBundleDisplayName: SynaraNotificationService
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        SynaraKeychainAccessGroup: "$(AppIdentifierPrefix)com.whylandcreative.synara.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotificationService"
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: SynaraNotificationService/Resources/SynaraNotificationService.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.whylandcreative.synara.NotificationService
        PRODUCT_NAME: SynaraNotificationService
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: "$(SYNARA_IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE)"
  SynaraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SynaraTests
    dependencies:
      - target: Synara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whylandcreative.synara.tests
        CODE_SIGNING_ALLOWED: "NO"
  SynaraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SynaraUITests
    dependencies:
      - target: Synara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whylandcreative.synara.uitests
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  Synara:
    build:
      targets:
        Synara: all
    test:
      targets:
        - SynaraTests
        - SynaraUITests
      gatherCoverageData: false
    run:
      config: Debug
