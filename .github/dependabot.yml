version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    groups:
      npm-updates:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:15"
      timezone: America/New_York
    open-pull-requests-limit: 2
    groups:
      github-actions-updates:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: tuesday
      time: "06:30"
      timezone: America/New_York
    open-pull-requests-limit: 2
    groups:
      rust-updates:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:35"
      timezone: America/New_York
    open-pull-requests-limit: 2
    groups:
      workspace-rust-updates:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /synara
    schedule:
      interval: weekly
      day: tuesday
      time: "06:05"
      timezone: America/New_York
    open-pull-requests-limit: 2
    groups:
      synara-npm-updates:
        patterns: ["*"]
