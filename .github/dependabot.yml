version: 2
# Monthly, grouped updates: one PR per ecosystem keeps review and CI load
# proportionate for a single maintainer. Security updates still open as soon
# as an advisory is published.
updates:
  - package-ecosystem: npm
    directories: ["/", "/synara"]
    # Keep Node types aligned with the pinned runtime; compiler/linter/formatter
    # majors flow through the normal coordinated dependency review.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    groups:
      npm-updates:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:15"
      timezone: America/New_York
    open-pull-requests-limit: 1
    groups:
      github-actions-updates:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "06:35"
      timezone: America/New_York
    open-pull-requests-limit: 1
    groups:
      workspace-rust-updates:
        patterns: ["*"]
