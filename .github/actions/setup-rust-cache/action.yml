name: Setup Kache and Cargo downloads
description: Cache compiler outputs with Kache; trusted main writers publish snapshots.
inputs:
  family:
    description: Compatible compilation graph family
    required: true
  save-cache:
    description: Whether this lane is an authorized main-branch writer
    default: "false"
  max-size:
    description: Production compiler store LRU eviction target
    default: 5GiB
  seed-pull-request:
    description: >-
      On a pull request that finds no compiler snapshot at all for this family
      (a new Xcode or Rust, say), output seed-key so the job can save one after
      its build, scoped to that pull request, and its next runs start warm.
      Main's snapshots are untouched.
    default: "false"
outputs:
  seed-key:
    description: Snapshot key this pull request should save after building; empty when a snapshot exists
    value: ${{ steps.seed.outputs.key }}
runs:
  using: composite
  steps:
    - name: Identify compiler and download caches
      id: identity
      shell: bash
      env:
        SYNARA_CACHE_FAMILY: ${{ inputs.family }}
        SYNARA_CACHE_WRITER: ${{ inputs.save-cache }}
      run: bash scripts/ci-rust-cache-identity.sh
    # One snapshot per family, lockfile and ISO week. A per-commit key kept a
    # 4 GiB copy for every main push and pushed the release families past the
    # repository cache limit. The nightly prune keeps only the newest entry.
    - name: Select weekly compiler snapshot key
      id: week
      shell: bash
      run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
    - name: Look up compiler snapshots for a seeding pull request
      id: seed-lookup
      if: inputs.save-cache != 'true' && inputs.seed-pull-request == 'true' && github.event_name == 'pull_request'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        lookup-only: true
        path: ${{ github.workspace }}/.kache-cache
        key: ${{ steps.identity.outputs.compiler-prefix }}-${{ hashFiles('Cargo.lock') }}-${{ steps.week.outputs.week }}
        restore-keys: |
          ${{ steps.identity.outputs.compiler-prefix }}-${{ hashFiles('Cargo.lock') }}-
          ${{ steps.identity.outputs.compiler-prefix }}-
    - name: Name the pull-request-scoped compiler snapshot
      id: seed
      if: steps.seed-lookup.outcome == 'success' && steps.seed-lookup.outputs.cache-matched-key == ''
      shell: bash
      env:
        SEED_KEY: ${{ steps.identity.outputs.compiler-prefix }}-${{ hashFiles('Cargo.lock') }}-${{ steps.week.outputs.week }}
      run: |
        echo "key=$SEED_KEY" >> "$GITHUB_OUTPUT"
        echo "No compiler snapshot exists for this family; this pull request will save \`$SEED_KEY\` for its own later runs." >> "$GITHUB_STEP_SUMMARY"
    - name: Restore compiler snapshots for readers
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ github.workspace }}/.kache-cache
        key: ${{ steps.identity.outputs.compiler-prefix }}-${{ hashFiles('Cargo.lock') }}-${{ steps.week.outputs.week }}
        restore-keys: |
          ${{ steps.identity.outputs.compiler-prefix }}-${{ hashFiles('Cargo.lock') }}-
          ${{ steps.identity.outputs.compiler-prefix }}-
    - name: Restore and publish compiler snapshots for main writers
      if: inputs.save-cache == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ github.workspace }}/.kache-cache
        key: ${{ steps.identity.outputs.compiler-prefix }}-${{ hashFiles('Cargo.lock') }}-${{ steps.week.outputs.week }}
        restore-keys: |
          ${{ steps.identity.outputs.compiler-prefix }}-${{ hashFiles('Cargo.lock') }}-
          ${{ steps.identity.outputs.compiler-prefix }}-
    - name: Restore Cargo downloads for readers
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: synara-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: synara-cargo-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore and publish Cargo downloads for main writers
      if: inputs.save-cache == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: synara-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: synara-cargo-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Fetch complete locked Cargo download graph
      if: inputs.save-cache == 'true' && github.ref == 'refs/heads/main'
      shell: bash
      run: cargo fetch --locked --manifest-path Cargo.toml
    - name: Install pinned Kache compiler wrapper
      uses: kunobi-ninja/kache-action@1a33fb2ff51be23eb9e87abeae6edb65be78f71c # pinned 2026-10-03
      with:
        version: v1.0.0
        # Own persistence so unchanged lockfiles can still publish new source artifacts.
        github-cache: "false"
        save-cache: "false"
        cache-dir: ${{ github.workspace }}/.kache-cache
        max-size: ${{ inputs.max-size }}
        cache-executables: "true"
        cache-c-cpp: "true"
        pr-comment: "false"
        job-summary: "true"
        strict: "true"
    - name: Start and verify job compiler cache daemon
      shell: bash
      env:
        SYNARA_CACHE_MAX_SIZE: ${{ inputs.max-size }}
      run: node scripts/start-ci-rust-cache.mjs
