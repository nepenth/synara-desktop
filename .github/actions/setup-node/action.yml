name: Setup Node and shared npm downloads
description: Pin Node and restore content-verified npm downloads; only main writes.
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - name: Locate npm download cache
      id: npm-cache
      shell: bash
      run: |
        echo "NPM_CONFIG_CACHE=$GITHUB_WORKSPACE/.npm-download-cache" >> "$GITHUB_ENV"
        echo "path=.npm-download-cache" >> "$GITHUB_OUTPUT"
    - name: Restore npm downloads on branches and tags
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.npm-cache.outputs.path }}
        key: npm-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'synara/package-lock.json') }}
        restore-keys: npm-downloads-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore and save npm downloads on main
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.npm-cache.outputs.path }}
        key: npm-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'synara/package-lock.json') }}
        restore-keys: npm-downloads-${{ runner.os }}-${{ runner.arch }}-
