name: Release Desktop

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-deb:
    name: Linux .deb release artifact
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        run: npm run check:versions

      - name: Build Linux .deb package
        run: npm run tauri build -- --bundles deb
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload Linux .deb release artifact
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: src-tauri/target/release/bundle/deb/Synara_*.deb

  linux-arch:
    name: Linux pacman repo artifact
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            dbus \
            libsecret \
            webkit2gtk-4.1 \
            xdg-desktop-portal \
            nodejs \
            npm \
            rust \
            base-devel \
            pacman-contrib \
            curl \
            wget \
            file \
            openssl \
            gst-plugins-good \
            appmenu-gtk-module \
            libayatana-appindicator \
            librsvg \
            xdotool

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        run: npm run check:versions

      - name: Build Linux release binary
        run: npm run tauri build -- --no-bundle
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Build Arch pacman package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -f --noconfirm"

      - name: Generate pacman repository assets
        run: scripts/build-pacman-repo.sh

      - name: Upload pacman repository assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synara-pacman-repo-assets
          path: dist/pacman-repo/*
          if-no-files-found: error

  publish-pacman-repo:
    name: Publish GitHub Release backed pacman repo
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    needs: [linux-arch]
    env:
      GH_TOKEN: ${{ github.token }}
      PACMAN_REPO_TAG: pacman-repo
    steps:
      - name: Download pacman repository assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: synara-pacman-repo-assets
          path: pacman-repo

      - name: Upload package to versioned release
        run: gh release upload "$GITHUB_REF_NAME" pacman-repo/synara-desktop-bin-*.pkg.tar.zst --clobber

      - name: Create fixed pacman repository release
        run: |
          if gh release view "$PACMAN_REPO_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          gh release create "$PACMAN_REPO_TAG" \
            --target "$GITHUB_SHA" \
            --title "Synara pacman repository" \
            --notes "Stable pacman repository assets for Synara Desktop Arch-family installs." \
            --latest=false

      - name: Replace fixed pacman repository assets
        run: |
          mapfile -t asset_names < <(
            gh release view "$PACMAN_REPO_TAG" --json assets --jq '.assets[].name' |
              grep -E '^(synara[.](db|db[.]tar[.]gz|files|files[.]tar[.]gz)|synara-desktop-bin-.*[.]pkg[.]tar[.]zst)$' ||
              true
          )

          for asset_name in "${asset_names[@]}"; do
            gh release delete-asset "$PACMAN_REPO_TAG" "$asset_name" --yes
          done

          gh release upload "$PACMAN_REPO_TAG" pacman-repo/* --clobber

  macos:
    name: macOS release artifacts
    if: startsWith(github.ref_name, 'v')
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Configure release updater channel
        run: node scripts/configure-release-updater.mjs
        env:
          SYNARA_UPDATER_PUBKEY: ${{ vars.SYNARA_UPDATER_PUBKEY }}
          SYNARA_UPDATER_ENDPOINT: ${{ vars.SYNARA_UPDATER_ENDPOINT }}

      - name: Require signed updater release channel
        run: npm run check:release-updater -- --require-enabled

      - name: Validate macOS and updater signing secrets
        shell: bash
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required macOS release signing secrets:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Import Developer ID Application certificate
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/synara-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Build macOS universal release packages
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"${APPLE_SIGNING_IDENTITY}\",\"providerShortName\":\"${APPLE_TEAM_ID}\"}}}"
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Verify macOS app signature
        run: |
          codesign --verify --deep --strict --verbose=2 src-tauri/target/universal-apple-darwin/release/bundle/macos/Synara.app
          spctl --assess --type execute --verbose=4 src-tauri/target/universal-apple-darwin/release/bundle/macos/Synara.app

      - name: Verify macOS notarization staple
        run: |
          xcrun stapler validate src-tauri/target/universal-apple-darwin/release/bundle/macos/Synara.app
          xcrun stapler validate src-tauri/target/universal-apple-darwin/release/bundle/dmg/Synara_*.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 src-tauri/target/universal-apple-darwin/release/bundle/dmg/Synara_*.dmg

      - name: Collect macOS updater artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-updater-artifacts
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz.sig

      - name: Upload macOS release artifacts
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/Synara_*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.sig
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz.sig

  updater-metadata:
    name: Signed macOS updater metadata
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    needs: [macos]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download updater artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-updater-artifacts"
          path: updater-artifacts

      - name: Generate signed updater metadata
        run: |
          node scripts/generate-release-updater-metadata.mjs \
            --artifacts updater-artifacts \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "$(node -p "require('./package.json').version")" \
            --output latest.json

      - name: Upload signed updater metadata
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: latest.json
