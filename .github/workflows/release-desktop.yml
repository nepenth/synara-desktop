name: Release Synara

on:
  release:
    types: [published]

permissions:
  contents: write
  deployments: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Validate shared release version
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check version metadata
        run: npm run check:versions

      - name: Require release tag to match the shared version
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match shared version $expected_tag" >&2
            exit 1
          fi

  linux-deb:
    name: Linux .deb release artifact
    if: startsWith(github.ref_name, 'v')
    needs: [release-gate]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        run: npm run check:versions

      - name: Build Linux .deb package
        run: npm run tauri build -- --bundles deb
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload Linux .deb release artifact
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: src-tauri/target/release/bundle/deb/Synara_*.deb

  linux-arch:
    name: Linux pacman repo artifact
    if: startsWith(github.ref_name, 'v')
    needs: [release-gate]
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            dbus \
            enchant \
            hunspell-en_us \
            libsecret \
            webkit2gtk-4.1 \
            xdg-desktop-portal \
            nodejs \
            npm \
            rust \
            base-devel \
            pacman-contrib \
            curl \
            wget \
            file \
            openssl \
            gst-plugins-good \
            appmenu-gtk-module \
            libayatana-appindicator \
            librsvg \
            xdotool

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        run: npm run check:versions

      - name: Build Linux release binary
        run: npm run tauri build -- --no-bundle
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Build Arch pacman package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -f --noconfirm"

      - name: Generate pacman repository assets
        run: scripts/build-pacman-repo.sh

      - name: Upload pacman repository assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synara-pacman-repo-assets
          path: dist/pacman-repo/*
          if-no-files-found: error

  publish-pacman-repo:
    name: Publish GitHub Release backed pacman repo
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    needs: [linux-arch]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACMAN_REPO_TAG: pacman-repo
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download pacman repository assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: synara-pacman-repo-assets
          path: pacman-repo

      - name: Verify downloaded pacman repository assets
        run: |
          find pacman-repo -maxdepth 1 -type f -printf '%f\n' | sort
          test -f pacman-repo/synara.db
          test -f pacman-repo/synara.files
          compgen -G 'pacman-repo/synara-desktop-bin-*.pkg.tar.zst' >/dev/null

      - name: Upload package to versioned release
        run: gh release upload "$RELEASE_TAG" pacman-repo/synara-desktop-bin-*.pkg.tar.zst --clobber

      - name: Create fixed pacman repository release
        run: |
          if gh release view "$PACMAN_REPO_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          gh release create "$PACMAN_REPO_TAG" \
            --target "$GITHUB_SHA" \
            --title "Synara pacman repository" \
            --notes "Stable pacman repository assets for Synara Desktop Arch-family installs." \
            --latest=false

      - name: Replace fixed pacman repository assets
        run: |
          mapfile -t asset_names < <(
            gh release view "$PACMAN_REPO_TAG" --json assets --jq '.assets[].name' |
              grep -E '^(synara[.](db|db[.]tar[.]gz|files|files[.]tar[.]gz)|synara-desktop-bin-.*[.]pkg[.]tar[.]zst)$' ||
              true
          )

          for asset_name in "${asset_names[@]}"; do
            gh release delete-asset "$PACMAN_REPO_TAG" "$asset_name" --yes
          done

          gh release upload "$PACMAN_REPO_TAG" pacman-repo/* --clobber

  macos:
    name: macOS release artifacts
    if: startsWith(github.ref_name, 'v')
    needs: [release-gate]
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Configure release updater channel
        run: node scripts/configure-release-updater.mjs
        env:
          SYNARA_UPDATER_PUBKEY: ${{ vars.SYNARA_UPDATER_PUBKEY }}
          SYNARA_UPDATER_ENDPOINT: ${{ vars.SYNARA_UPDATER_ENDPOINT }}

      - name: Require signed updater release channel
        run: npm run check:release-updater -- --require-enabled

      - name: Validate macOS and updater signing secrets
        shell: bash
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required macOS release signing secrets:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Validate updater signing key password
        shell: bash
        run: |
          probe_file="$RUNNER_TEMP/synara-updater-signing-probe.txt"
          printf 'synara updater signing probe\n' > "$probe_file"
          npm run tauri -- signer sign "$probe_file" >/dev/null

      - name: Import Developer ID Application certificate
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/synara-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Build macOS universal release packages
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"${APPLE_SIGNING_IDENTITY}\",\"providerShortName\":\"${APPLE_TEAM_ID}\"}}}"
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Verify macOS app signature
        run: |
          codesign --verify --all-architectures --deep --strict --verbose=2 src-tauri/target/universal-apple-darwin/release/bundle/macos/Synara.app
          spctl --assess --type execute --verbose=4 src-tauri/target/universal-apple-darwin/release/bundle/macos/Synara.app

      - name: Verify macOS distributable contents
        shell: bash
        run: |
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name 'Synara_*.dmg' -print -quit)"
          updater_archive="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name 'Synara.app.tar.gz' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "No Synara DMG found" >&2
            exit 1
          fi
          if [[ -z "$updater_archive" ]]; then
            echo "No Synara updater archive found" >&2
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          extract_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            rm -rf "$mount_dir" "$extract_dir"
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_dir"
          codesign --verify --all-architectures --deep --strict --verbose=2 "$mount_dir/Synara.app"
          spctl --assess --type execute --verbose=4 "$mount_dir/Synara.app"

          tar -xzf "$updater_archive" -C "$extract_dir"
          codesign --verify --all-architectures --deep --strict --verbose=2 "$extract_dir/Synara.app"
          spctl --assess --type execute --verbose=4 "$extract_dir/Synara.app"

      - name: Notarize and staple macOS DMG
        run: |
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name 'Synara_*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "No Synara DMG found" >&2
            exit 1
          fi

          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"

      - name: Verify macOS notarization staple
        run: |
          xcrun stapler validate src-tauri/target/universal-apple-darwin/release/bundle/macos/Synara.app
          xcrun stapler validate src-tauri/target/universal-apple-darwin/release/bundle/dmg/Synara_*.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 src-tauri/target/universal-apple-darwin/release/bundle/dmg/Synara_*.dmg

      - name: Collect macOS updater artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-updater-artifacts
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz.sig

      - name: Upload macOS release artifacts
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/Synara_*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.sig
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz.sig

  ios-testflight:
    name: iOS internal TestFlight release
    if: startsWith(github.ref_name, 'v')
    needs: [release-gate]
    runs-on: macos-26
    environment:
      name: testflight
      url: https://appstoreconnect.apple.com/apps
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check shared version metadata
        run: npm run check:versions

      - name: Validate TestFlight release configuration
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_NOTIFICATION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_NOTIFICATION_PROVISIONING_PROFILE_BASE64 }}
          SYNARA_ASC_KEY_BASE64: ${{ secrets.SYNARA_ASC_KEY_BASE64 }}
          SYNARA_ASC_KEY_ID: ${{ secrets.SYNARA_ASC_KEY_ID }}
          SYNARA_ASC_ISSUER_ID: ${{ secrets.SYNARA_ASC_ISSUER_ID }}
          SYNARA_IOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SYNARA_PUSH_GATEWAY_URL: ${{ vars.SYNARA_PUSH_GATEWAY_URL }}
        run: |
          missing=()
          for name in \
            IOS_DISTRIBUTION_CERTIFICATE_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_APP_PROVISIONING_PROFILE_BASE64 \
            IOS_NOTIFICATION_PROVISIONING_PROFILE_BASE64 \
            SYNARA_ASC_KEY_BASE64 \
            SYNARA_ASC_KEY_ID \
            SYNARA_ASC_ISSUER_ID \
            SYNARA_IOS_TEAM_ID \
            SYNARA_PUSH_GATEWAY_URL; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required TestFlight release configuration:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

          if [[ "$SYNARA_PUSH_GATEWAY_URL" != https://* ]]; then
            echo "SYNARA_PUSH_GATEWAY_URL must use HTTPS for a TestFlight release." >&2
            exit 1
          fi

      - name: Import Apple Distribution identity
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          SYNARA_IOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          certificate_path="$RUNNER_TEMP/synara-ios-distribution.p12"
          keychain_path="$RUNNER_TEMP/synara-ios-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          chmod 600 "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identity_output="$(security find-identity -v -p codesigning "$keychain_path")"
          printf '%s\n' "$identity_output"
          if ! grep -F "Apple Distribution:" <<<"$identity_output" | grep -F "($SYNARA_IOS_TEAM_ID)" >/dev/null; then
            echo "The imported certificate is not an Apple Distribution identity for team $SYNARA_IOS_TEAM_ID." >&2
            exit 1
          fi

          echo "SYNARA_CI_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "SYNARA_CI_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"

      - name: Install App Store provisioning profiles
        shell: bash
        env:
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_NOTIFICATION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_NOTIFICATION_PROVISIONING_PROFILE_BASE64 }}
          SYNARA_IOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          expected_app_group="group.com.whylandcreative.synara"
          mkdir -p "$profiles_dir"

          install_profile() {
            local encoded_profile="$1"
            local expected_bundle_id="$2"
            local output_variable="$3"
            local file_stem="$4"
            local requires_push="$5"
            local cleanup_label="$6"
            local source_path="$RUNNER_TEMP/$file_stem.mobileprovision"
            local plist_path="$RUNNER_TEMP/$file_stem.plist"

            printf '%s' "$encoded_profile" | /usr/bin/base64 -D > "$source_path"
            security cms -D -i "$source_path" > "$plist_path"

            local profile_uuid
            local profile_app_id
            local profile_team_id
            local profile_app_group
            local aps_environment
            local get_task_allow
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist_path")"
            profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist_path")"
            profile_team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$plist_path")"
            profile_app_group="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$plist_path" 2>/dev/null || true)"
            aps_environment="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$plist_path" 2>/dev/null || true)"
            get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$plist_path" 2>/dev/null || printf 'false')"

            if [[ "$profile_team_id" != "$SYNARA_IOS_TEAM_ID" ]]; then
              echo "$file_stem profile belongs to team $profile_team_id, expected $SYNARA_IOS_TEAM_ID." >&2
              exit 1
            fi
            if [[ "$profile_app_id" != "$SYNARA_IOS_TEAM_ID.$expected_bundle_id" ]]; then
              echo "$file_stem profile targets $profile_app_id, expected $SYNARA_IOS_TEAM_ID.$expected_bundle_id." >&2
              exit 1
            fi
            if [[ "$get_task_allow" == "true" ]]; then
              echo "$file_stem is a development profile, not an App Store distribution profile." >&2
              exit 1
            fi
            if [[ "$profile_app_group" != "$expected_app_group" ]]; then
              echo "$file_stem profile App Group is '$profile_app_group', expected '$expected_app_group'." >&2
              exit 1
            fi
            if [[ "$requires_push" == "true" && "$aps_environment" != "production" ]]; then
              echo "$file_stem profile APNs environment is '$aps_environment', expected 'production'." >&2
              exit 1
            fi

            local installed_path="$profiles_dir/$profile_uuid.mobileprovision"
            cp "$source_path" "$installed_path"
            chmod 600 "$installed_path"
            echo "$output_variable=$profile_uuid" >> "$GITHUB_ENV"
            echo "${output_variable}_PATH=$installed_path" >> "$GITHUB_ENV"
            echo "SYNARA_CI_${cleanup_label}_SOURCE=$source_path" >> "$GITHUB_ENV"
            echo "SYNARA_CI_${cleanup_label}_PLIST=$plist_path" >> "$GITHUB_ENV"
          }

          install_profile \
            "$IOS_APP_PROVISIONING_PROFILE_BASE64" \
            "com.whylandcreative.synara" \
            "SYNARA_IOS_PROVISIONING_PROFILE" \
            "app_profile" \
            "true" \
            "APP_PROFILE"
          install_profile \
            "$IOS_NOTIFICATION_PROVISIONING_PROFILE_BASE64" \
            "com.whylandcreative.synara.NotificationService" \
            "SYNARA_IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE" \
            "notification_profile" \
            "false" \
            "NOTIFICATION_PROFILE"

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          SYNARA_ASC_KEY_BASE64: ${{ secrets.SYNARA_ASC_KEY_BASE64 }}
          SYNARA_ASC_KEY_ID: ${{ secrets.SYNARA_ASC_KEY_ID }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${SYNARA_ASC_KEY_ID}.p8"
          printf '%s' "$SYNARA_ASC_KEY_BASE64" | /usr/bin/base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "SYNARA_ASC_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          echo "SYNARA_CI_ASC_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Archive and upload internal TestFlight build
        env:
          SYNARA_ASC_KEY_ID: ${{ secrets.SYNARA_ASC_KEY_ID }}
          SYNARA_ASC_ISSUER_ID: ${{ secrets.SYNARA_ASC_ISSUER_ID }}
          SYNARA_IOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SYNARA_PUSH_GATEWAY_URL: ${{ vars.SYNARA_PUSH_GATEWAY_URL }}
        run: synara-ios/scripts/upload-testflight-internal.sh

      - name: Clean signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${SYNARA_CI_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$SYNARA_CI_KEYCHAIN_PATH" >/dev/null 2>&1 || true
          fi
          rm -f \
            "${SYNARA_CI_CERTIFICATE_PATH:-}" \
            "${SYNARA_CI_ASC_KEY_PATH:-}" \
            "${SYNARA_IOS_PROVISIONING_PROFILE_PATH:-}" \
            "${SYNARA_IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_PATH:-}" \
            "${SYNARA_CI_APP_PROFILE_SOURCE:-}" \
            "${SYNARA_CI_APP_PROFILE_PLIST:-}" \
            "${SYNARA_CI_NOTIFICATION_PROFILE_SOURCE:-}" \
            "${SYNARA_CI_NOTIFICATION_PROFILE_PLIST:-}"

  updater-metadata:
    name: Signed macOS updater metadata
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    needs: [macos]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download updater artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-updater-artifacts"
          path: updater-artifacts

      - name: Generate signed updater metadata
        run: |
          node scripts/generate-release-updater-metadata.mjs \
            --artifacts updater-artifacts \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "$(node -p "require('./package.json').version")" \
            --output latest.json

      - name: Upload signed updater metadata
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: latest.json
