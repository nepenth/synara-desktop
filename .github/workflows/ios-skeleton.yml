name: iOS Skeleton

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-skeleton.yml"
      - "synara-ios/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ios-skeleton.yml"
      - "synara-ios/**"
  workflow_dispatch:

concurrency:
  group: ios-skeleton-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned simulator build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned simulator app and test bundles
        run: scripts/ci-build.sh
        working-directory: synara-ios
