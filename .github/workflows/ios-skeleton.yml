name: iOS Diagnostics

on:
  workflow_dispatch:

concurrency:
  group: ios-skeleton-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unsigned simulator build and tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and run unsigned simulator tests
        run: scripts/ci-build.sh
        working-directory: synara-ios
        env:
          RUN_IOS_TESTS: "1"

      - name: Upload iOS result bundles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-diagnostic-results
          path: /private/tmp/synara-ios-results/*.xcresult
          if-no-files-found: warn
          retention-days: 14
