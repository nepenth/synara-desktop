name: iOS Diagnostics

on:
  workflow_dispatch:

concurrency:
  group: ios-skeleton-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unsigned simulator build and tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and run unsigned simulator tests
        run: scripts/ci-build.sh
        working-directory: synara-ios
        env:
          RUN_IOS_TESTS: "1"

      - name: Upload iOS result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-diagnostic-results
          path: /private/tmp/synara-ios-results/*.xcresult
          if-no-files-found: warn
          retention-days: 14
