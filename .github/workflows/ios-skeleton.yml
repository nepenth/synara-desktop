name: iOS Diagnostics

on:
  workflow_dispatch:

concurrency:
  group: ios-skeleton-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unsigned simulator build and tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    # Bounded cap allows post-test output/upload.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96 and Apple targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96
          components: llvm-tools-preview
          targets: aarch64-apple-ios-sim

      - name: Restore Apple simulator Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target/synara-core-apple
            . -> target/synara-core-bindgen
          env-vars: DEVELOPER_DIR
          shared-key: ci-synara-core-apple-simulator-arm64
          save-if: "false"

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          test "$(xcodegen --version)" = "Version: 2.46.0"

      - name: Restore native Xcode compilation cache
        id: xcode_cache
        uses: ./.github/actions/setup-xcode-cache

      - name: Build and run unsigned simulator tests
        run: scripts/ci-build.sh
        working-directory: synara-ios
        env:
          RUN_IOS_TESTS: "1"
          IOS_TEST_SUITE: all
          SYNARA_CORE_APPLE_SLICES: simulator-arm64

      - name: Upload iOS result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-diagnostic-results
          path: /private/tmp/synara-ios-results/*.xcresult
          if-no-files-found: warn
          retention-days: 14
