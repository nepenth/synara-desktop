name: Windows spike

# Windows compile and test probe, plus an unsigned test installer. It runs
# weekly and on manual dispatch, never on pull requests, so it cannot block the
# Quality gate; the installer builds only on dispatch. A dispatch with
# release_tag skips both and only checks that release's published setup
# launches to the sign-in screen, which takes minutes instead of a build.
# Every probe keeps going past failures so one run reports them all, then the
# run fails if any did; docs/windows-support-spike.md records the findings.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Only check this published release's setup.exe (e.g. v2.6.0)
        type: string
        default: ""
  schedule:
    - cron: "17 7 * * 1"

concurrency:
  group: windows-spike-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-probe:
    name: Windows compile and test probe
    if: inputs.release_tag == ''
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      # Full PDBs for the whole Matrix graph only cost disk and link time here.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
      TARGET: x86_64-pc-windows-msvc
      LOGS: ${{ github.workspace }}/windows-spike-logs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96
          targets: x86_64-pc-windows-msvc

      - name: Record the build environment
        run: |
          mkdir -p "$LOGS"
          {
            rustc -Vv
            cargo -V
            echo "cmake: $(command -v cmake || echo missing)"
            echo "nasm: $(command -v nasm || echo missing)"
            echo "clang: $(command -v clang || echo missing)"
            echo "node: $(node --version 2>&1)"
            df -h . || true
          } 2>&1 | tee "$LOGS/environment.log"

      - name: Check the whole workspace for Windows
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --locked --workspace --all-targets --keep-going --target "$TARGET" 2>&1 | tee "$LOGS/cargo-check-workspace.log"

      - name: Test the desktop shell library
        id: shell_tests
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --locked -p synara --lib --no-fail-fast --target "$TARGET" 2>&1 | tee "$LOGS/cargo-test-synara-lib.log"

      - name: Test synara-core (default features)
        id: core_tests
        if: always()
        continue-on-error: true
        env:
          RUST_TEST_THREADS: 4
        run: |
          set -o pipefail
          cargo test --locked -p synara-core --no-fail-fast --target "$TARGET" 2>&1 | tee "$LOGS/cargo-test-synara-core.log"

      - name: Test synara-core (desktop features)
        id: core_desktop_tests
        if: always()
        continue-on-error: true
        env:
          RUST_TEST_THREADS: 4
        run: |
          set -o pipefail
          cargo test --locked -p synara-core --features search-index,x509-identity --no-fail-fast --target "$TARGET" 2>&1 | tee "$LOGS/cargo-test-synara-core-desktop.log"

      - name: Summarize probe outcomes
        if: always()
        run: |
          {
            echo "check=${{ steps.check.outcome }}"
            echo "synara-lib-tests=${{ steps.shell_tests.outcome }}"
            echo "synara-core-tests=${{ steps.core_tests.outcome }}"
            echo "synara-core-desktop-tests=${{ steps.core_desktop_tests.outcome }}"
          } | tee "$LOGS/outcomes.txt" >> "$GITHUB_STEP_SUMMARY"
          for log in "$LOGS"/cargo-*.log; do
            echo "== $(basename "$log")"
            grep -E '^(error(\[E[0-9]+\])?:|test .* FAILED|failures:|test result:)' "$log" | sort | uniq -c | sort -rn | head -60 || true
          done | tee "$LOGS/summary.txt"

      - name: Upload probe logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-spike-logs
          path: windows-spike-logs
          retention-days: 14

      # Linux CI denies warnings; Windows-only dead code would otherwise drift.
      - name: Fail if any probe failed or warned
        if: always()
        run: |
          if grep -E '^warning: ' "$LOGS/cargo-check-workspace.log"; then
            echo "Windows-only compiler warnings; see cargo-check-workspace.log." >&2
            exit 1
          fi
          if grep -qv '=success$' "$LOGS/outcomes.txt"; then
            echo "A Windows probe failed; see windows-spike-logs." >&2
            exit 1
          fi

  # An unsigned test installer. Nothing is signed or published; Windows
  # SmartScreen warns on first run ("More info" > "Run anyway").
  windows-installer:
    name: Unsigned Windows test installer
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Run renderer unit tests
        run: npm run test:modernization
        working-directory: synara

      # From cmd, the way a Windows developer runs it.
      - name: Build MSI and NSIS installers
        shell: cmd
        run: npm run tauri build -- --bundles msi,nsis
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      # Installs the setup, launches Synara and requires the renderer to draw
      # the sign-in screen (scripts/windows-ui-smoke.mjs).
      - name: Launch the installed app and check its UI
        run: node scripts/windows-ui-smoke.mjs --setup "$(ls target/release/bundle/nsis/Synara_*_x64-setup.exe)" --out "$RUNNER_TEMP/windows-ui-smoke"

      - name: Upload Windows UI screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ui-smoke
          path: ${{ runner.temp }}/windows-ui-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synara-windows-test-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # The published setup of a release, installed and launched like a user would.
  windows-release-ui:
    name: Published Windows setup UI check
    if: inputs.release_tag != ''
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download the release setup
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Synara_*_x64-setup.exe' --dir "$RUNNER_TEMP/release-setup"

      - name: Launch the installed app and check its UI
        run: node scripts/windows-ui-smoke.mjs --setup "$(ls "$RUNNER_TEMP"/release-setup/Synara_*_x64-setup.exe)" --out "$RUNNER_TEMP/windows-ui-smoke"

      - name: Upload Windows UI screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ui-smoke-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/windows-ui-smoke
          if-no-files-found: warn
          retention-days: 14
