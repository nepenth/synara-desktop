name: Windows spike

# What breaks when the desktop app is built for Windows, plus an unsigned
# test installer. Manual dispatch, so it never runs on pull requests or
# blocks the Quality gate. Every probe keeps going past failures so one run
# reports them all; docs/windows-support-spike.md records the findings.
on:
  workflow_dispatch:
  # TEMPORARY: GitHub only dispatches workflows present on the default branch,
  # so this branch runs from a push. Remove before merging.
  push:
    branches: [claude/windows-spike-17dfda]

concurrency:
  group: windows-spike-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-probe:
    name: Windows compile and test probe
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      # Full PDBs for the whole Matrix graph only cost disk and link time here.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
      TARGET: x86_64-pc-windows-msvc
      LOGS: ${{ github.workspace }}/windows-spike-logs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96
          targets: x86_64-pc-windows-msvc

      - name: Record the build environment
        run: |
          mkdir -p "$LOGS"
          {
            rustc -Vv
            cargo -V
            echo "cmake: $(command -v cmake || echo missing)"
            echo "nasm: $(command -v nasm || echo missing)"
            echo "clang: $(command -v clang || echo missing)"
            echo "node: $(node --version 2>&1)"
            df -h . || true
          } 2>&1 | tee "$LOGS/environment.log"

      - name: Check the whole workspace for Windows
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --locked --workspace --all-targets --keep-going --target "$TARGET" 2>&1 | tee "$LOGS/cargo-check-workspace.log"

      - name: Test the desktop shell library
        id: shell_tests
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --locked -p synara --lib --no-fail-fast --target "$TARGET" 2>&1 | tee "$LOGS/cargo-test-synara-lib.log"

      - name: Test synara-core (default features)
        id: core_tests
        if: always()
        continue-on-error: true
        env:
          RUST_TEST_THREADS: 4
        run: |
          set -o pipefail
          cargo test --locked -p synara-core --no-fail-fast --target "$TARGET" 2>&1 | tee "$LOGS/cargo-test-synara-core.log"

      - name: Test synara-core (desktop features)
        id: core_desktop_tests
        if: always()
        continue-on-error: true
        env:
          RUST_TEST_THREADS: 4
        run: |
          set -o pipefail
          cargo test --locked -p synara-core --features search-index,x509-identity --no-fail-fast --target "$TARGET" 2>&1 | tee "$LOGS/cargo-test-synara-core-desktop.log"

      # The build entry points, run the way a Windows developer would.
      - name: Setup Node.js
        if: always()
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Probe the tauri npm script from cmd
        id: npm_tauri
        if: always()
        continue-on-error: true
        shell: cmd
        run: npm run tauri -- --version

      - name: Probe the Tauri beforeBuildCommand
        id: build_runtime
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          {
            npm ci --prefix synara --no-audit --no-fund
            node scripts/build-runtime.mjs
          } 2>&1 | tee "$LOGS/build-runtime.log"

      - name: Summarize probe outcomes
        if: always()
        run: |
          {
            echo "check=${{ steps.check.outcome }}"
            echo "synara-lib-tests=${{ steps.shell_tests.outcome }}"
            echo "synara-core-tests=${{ steps.core_tests.outcome }}"
            echo "synara-core-desktop-tests=${{ steps.core_desktop_tests.outcome }}"
            echo "npm-run-tauri=${{ steps.npm_tauri.outcome }}"
            echo "build-runtime=${{ steps.build_runtime.outcome }}"
          } | tee "$LOGS/outcomes.txt" >> "$GITHUB_STEP_SUMMARY"
          for log in "$LOGS"/cargo-*.log; do
            echo "== $(basename "$log")"
            grep -E '^(error(\[E[0-9]+\])?:|test .* FAILED|failures:|test result:)' "$log" | sort | uniq -c | sort -rn | head -60 || true
          done | tee "$LOGS/summary.txt"

      - name: Upload probe logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-spike-logs
          path: windows-spike-logs
          retention-days: 14

  # An unsigned test installer. Nothing is signed or published; Windows
  # SmartScreen warns on first run ("More info" > "Run anyway").
  windows-installer:
    name: Unsigned Windows test installer
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      # Calls the Tauri CLI directly: `npm run tauri` needs bash on Windows.
      - name: Build MSI and NSIS installers
        run: npx tauri build --bundles msi,nsis
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload test installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synara-windows-test-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
