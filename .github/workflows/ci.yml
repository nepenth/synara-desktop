name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate desktop and runtime
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check repository layout
        run: npm run check:repo-layout

      - name: Check version metadata
        run: npm run check:versions

      - name: Check Matrix integration boundaries
        run: npm run check:matrix-boundaries

      - name: Check Rust desktop shell
        run: cargo check --locked
        working-directory: src-tauri

      - name: Test Rust desktop shell
        run: cargo test --locked
        working-directory: src-tauri

      - name: Typecheck runtime modernization surface
        run: npm run typecheck:modernization
        working-directory: synara

      - name: Test runtime modernization surface
        run: npm run test:modernization
        working-directory: synara

      - name: Check runtime lint
        run: npm run check:eslint
        working-directory: synara

      - name: Check runtime formatting
        run: npm run check:prettier
        working-directory: synara
