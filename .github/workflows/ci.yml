name: CI

# Fast gate on pull requests and main; the nightly schedule (and manual
# dispatch) is the heavy suite: XCUITests, live Synapse proofs, package builds
# and release-cache seeding. Path scopes live in scripts/ci-scopes.sh.
on:
  push:
    branches: [main]
  pull_request:
    # No labeled/unlabeled: label events re-ran (and cancelled) the whole
    # suite. Opt-in labels (needs-ios, needs-ios-ui) apply from the next push.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      [
        main,
        "feature/matrix-rust-sdk-full-replacement",
        "feature/shared-native-core",
        "release/**",
      ]
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      apple_slices:
        description: Apple Rust slices to validate in the unsigned unit-test lane
        type: choice
        options: [simulator-arm64, all]
        default: simulator-arm64
      check_ios_device_release:
        description: Also compile the unsigned iOS device Release app and inspect its NSE archive
        type: boolean
        default: false
      packages:
        description: Also build Linux/Arch/macOS packages and seed the release caches
        type: boolean
        default: false

# One lane per event and ref: a push to main never cancels the nightly run,
# and a newer push to a PR cancels only that PR's previous run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect CI scopes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      icon_only: ${{ steps.scope.outputs.icon_only }}
      validate_rust: ${{ steps.scope.outputs.validate_rust }}
      rust_audit: ${{ steps.scope.outputs.rust_audit }}
      validate_frontend: ${{ steps.scope.outputs.validate_frontend }}
      ios: ${{ steps.scope.outputs.ios }}
      ios_ui: ${{ steps.scope.outputs.ios_ui }}
      ios_compile: ${{ steps.scope.outputs.ios_compile }}
      synapse: ${{ steps.scope.outputs.synapse }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require TestFlight notes on release PRs
        if: startsWith(github.head_ref, 'release/')
        run: node scripts/check-ios-release-notes.mjs

      - name: Determine which CI jobs must run
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PACKAGES_INPUT: ${{ inputs.packages }}
        run: bash scripts/ci-scopes.sh

  rust-lint:
    name: Rust format and lint
    needs: [changes]
    if: needs.changes.outputs.validate_rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust build input invalidation
        run: |
          rustc --edition=2021 --test src-tauri/build_support/build_inputs.rs -o "$RUNNER_TEMP/synara-build-input-tests"
          "$RUNNER_TEMP/synara-build-input-tests"

      - name: Prove shipping Core feature boundaries
        run: |
          node scripts/check-synara-core-production-features.mjs
          node scripts/check-synara-nse-core-production-features.mjs

      - name: Check Matrix integration boundaries
        run: node scripts/check-matrix-boundaries.mjs

      - name: Restore Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          family: validate-rust-desktop
          save-cache: "false"

      - name: Install Linux Tauri dependencies
        run: scripts/install-linux-tauri-dependencies.sh

      # clippy --all-targets type-checks everything `cargo check` would.
      - name: Lint Rust desktop shell
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Lint shared Rust workspace
        run: cargo clippy --locked -p synara-core -p synara-nse-core -p synara-core-bindgen --all-targets -- -D warnings

      # Desktop-only Core features are otherwise only compiled through src-tauri.
      - name: Lint desktop-only Core features
        run: cargo clippy --locked -p synara-core --features search-index,x509-identity --all-targets -- -D warnings

  rust-tests:
    name: Rust tests
    needs: [changes]
    if: needs.changes.outputs.validate_rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96

      - name: Cache Rust compilation
        uses: ./.github/actions/setup-rust-cache
        with:
          family: validate-rust-desktop
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux Tauri dependencies
        run: scripts/install-linux-tauri-dependencies.sh

      - name: Test Rust desktop shell
        run: cargo test --locked
        working-directory: src-tauri

      - name: Test shared Rust workspace
        env:
          RUST_TEST_THREADS: 4
        run: cargo test --locked -p synara-core -p synara-nse-core -p synara-core-bindgen

      - name: Test desktop-only Core features
        env:
          RUST_TEST_THREADS: 4
        run: cargo test --locked -p synara-core --features search-index,x509-identity

  rust-dependency-audit:
    name: Rust dependency audit (cargo-audit)
    needs: [changes]
    if: needs.changes.outputs.rust_audit == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96

      - name: Install cargo-audit
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2, pinned installer/checksums
        with:
          tool: cargo-audit@0.22.2
          checksum: true
          fallback: none

      # Desktop, full Core, bindgen, and NSE resolve from one root lockfile.
      - name: Audit Rust workspace dependencies (RustSec advisory DB)
        run: cargo audit

  validate-frontend:
    name: Validate Node desktop runtime
    needs: [changes]
    if: needs.changes.outputs.validate_frontend == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js and npm download cache
        uses: ./.github/actions/setup-node

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Lint workflows and documentation
        run: npm run check:workflows

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Install Chromium and WebKit for browser tests
        run: npx playwright install --with-deps chromium webkit
        working-directory: synara

      - name: Check repository contracts
        run: |
          npm run check:repo-layout
          npm run check:versions
          npm run check:matrix-boundaries
          npm run check:synapse-harness
          npm run check:production-smoke
          npm run check:release-updater

      - name: Test repository delivery scripts
        run: node --test scripts/__tests__/*.test.mjs

      - name: Check runtime formatting
        run: npm run check:prettier
        working-directory: synara

      - name: Check runtime lint
        run: npm run check:eslint
        working-directory: synara

      - name: Typecheck desktop runtime
        run: npm run typecheck
        working-directory: synara

      - name: Typecheck runtime modernization surface
        run: npm run typecheck:modernization
        working-directory: synara

      - name: Test runtime modernization surface
        run: npm run test:modernization
        working-directory: synara

      - name: Test real-layout timeline scrolling
        id: browser_timeline
        run: npm run test:browser:timeline
        working-directory: synara

      # One retry: the Hermes frame-timing assertion is timing-sensitive on
      # shared runners. A test that passes only on retry is reported as flaky.
      - name: Test native timeline navigation and macOS layout
        id: browser_native_timeline
        run: npm run test:browser:native-timeline -- --retries=1
        working-directory: synara

      - name: Test desktop room navigation and approvals in Chromium
        id: browser_desktop_polish
        run: npm run test:browser:desktop-polish:ci
        working-directory: synara

      - name: macOS navigation unread regression tests
        id: browser_navigation_unread
        run: npx playwright test --config e2e/room-list-harness/playwright.config.ts navigation-unread.spec.ts --project=webkit
        working-directory: synara

      - name: Check production dependency advisories
        run: npm run check:security
        working-directory: synara

      - name: Upload failed browser diagnostics
        if: failure() && (steps.browser_timeline.outcome == 'failure' || steps.browser_native_timeline.outcome == 'failure' || steps.browser_desktop_polish.outcome == 'failure' || steps.browser_navigation_unread.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-browser-failure-diagnostics
          path: |
            synara/test-results
            synara/playwright-report
          if-no-files-found: warn
          retention-days: 3

  ios-tests:
    name: iOS simulator tests
    needs: [changes]
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    # Default: arm64 simulator + unit tests. Manual all-slice/device opt-ins
    # compile the full Apple graph and unsigned device Release NSE here.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96 and Apple targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96
          components: llvm-tools-preview
          targets: ${{ github.event_name == 'workflow_dispatch' && (inputs.apple_slices == 'all' || inputs.check_ios_device_release) && 'aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin' || 'aarch64-apple-ios-sim' }}

      - name: Cache Apple SynaraCore Rust compilation
        uses: ./.github/actions/setup-rust-cache
        with:
          family: ci-synara-core-apple-simulator-arm64
          save-cache: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (inputs.apple_slices != 'all' && !inputs.check_ios_device_release)) }}

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          test "$(xcodegen --version)" = "Version: 2.46.0"

      - name: Restore native Xcode compilation cache
        id: xcode_cache
        uses: ./.github/actions/setup-xcode-cache

      - name: Check SynaraCore Swift scaffold
        run: node scripts/check-synara-core-swift-scaffold.mjs

      - name: Check SynaraNseCore isolation
        run: node scripts/check-synara-nse-core-isolation.mjs

      - name: Build and run unsigned simulator tests
        run: scripts/ci-build.sh
        working-directory: synara-ios
        env:
          RUN_IOS_TESTS: "1"
          IOS_TEST_SUITE: unit
          IOS_TEST_RETRY_ON_FAILURE: "1"
          SYNARA_CORE_APPLE_SLICES: ${{ github.event_name == 'workflow_dispatch' && (inputs.apple_slices == 'all' || inputs.check_ios_device_release) && 'all' || 'simulator-arm64' }}
          CHECK_IOS_DEVICE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.check_ios_device_release && '1' || '0' }}

      - name: Publish bounded Xcode compiler cache from main
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/save-xcode-cache
        with:
          cache-key: ${{ steps.xcode_cache.outputs.cache-key }}
          cache-path: ${{ steps.xcode_cache.outputs.cache-path }}
          cache-hit: ${{ steps.xcode_cache.outputs.cache-hit }}

      - name: Upload iOS result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: /private/tmp/synara-ios-results/*.xcresult
          if-no-files-found: warn
          retention-days: 3

  ios-ui-tests:
    name: iOS simulator UI tests
    needs: [changes]
    if: needs.changes.outputs.ios_ui == 'true'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96 and Apple targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96
          components: llvm-tools-preview
          targets: aarch64-apple-ios-sim

      - name: Cache Apple SynaraCore Rust compilation
        uses: ./.github/actions/setup-rust-cache
        with:
          family: ci-synara-core-apple-simulator-arm64
          save-cache: "false"

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          test "$(xcodegen --version)" = "Version: 2.46.0"

      - name: Restore native Xcode compilation cache
        id: xcode_cache
        uses: ./.github/actions/setup-xcode-cache

      - name: Check SynaraCore Swift scaffold
        run: node scripts/check-synara-core-swift-scaffold.mjs

      - name: Check SynaraNseCore isolation
        run: node scripts/check-synara-nse-core-isolation.mjs

      - name: Build and run unsigned simulator UI tests
        run: scripts/ci-build.sh
        working-directory: synara-ios
        env:
          RUN_IOS_TESTS: "1"
          IOS_TEST_SUITE: ui
          IOS_TEST_RETRY_ON_FAILURE: "1"
          SYNARA_CORE_APPLE_SLICES: simulator-arm64

      - name: Upload iOS UI result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-ui-test-results
          path: /private/tmp/synara-ios-results/*.xcresult
          if-no-files-found: warn
          retention-days: 3

  ios-compile:
    name: iOS compile gate
    needs: [changes]
    if: needs.changes.outputs.ios_compile == 'true'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    # Runs when Swift/FFI/iOS paths changed and the simulator lane was skipped:
    # build-for-testing for the arm64 simulator slice, no simulator boot.
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96 and Apple targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96
          components: llvm-tools-preview
          targets: aarch64-apple-ios-sim

      - name: Cache Apple SynaraCore Rust compilation
        uses: ./.github/actions/setup-rust-cache
        with:
          family: ci-synara-core-apple-simulator-arm64
          save-cache: "false"

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          test "$(xcodegen --version)" = "Version: 2.46.0"

      - name: Restore native Xcode compilation cache
        id: xcode_cache
        uses: ./.github/actions/setup-xcode-cache

      - name: Check SynaraCore Swift scaffold
        run: node scripts/check-synara-core-swift-scaffold.mjs

      - name: Check SynaraNseCore isolation
        run: node scripts/check-synara-nse-core-isolation.mjs

      - name: Build simulator targets for testing without running tests
        run: scripts/ci-build.sh
        working-directory: synara-ios
        env:
          RUN_IOS_TESTS: "0"
          SYNARA_CORE_APPLE_SLICES: simulator-arm64

      - name: Upload iOS build result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-compile-results
          path: /private/tmp/synara-ios-results/*.xcresult
          if-no-files-found: warn
          retention-days: 3

  synapse-live:
    name: Synapse live proofs
    needs: [changes]
    if: needs.changes.outputs.synapse == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96

      - name: Restore desktop Rust compilation cache
        uses: ./.github/actions/setup-rust-cache
        with:
          family: validate-rust-desktop
          save-cache: "false"

      - name: Install Linux Tauri dependencies
        run: scripts/install-linux-tauri-dependencies.sh

      - name: Compile desktop tests once
        run: cargo test --locked --no-run
        working-directory: src-tauri

      # Each proof gets a fresh disposable Synapse, as the separate jobs did.
      - name: Prove native owners against disposable Synapse
        env:
          SYNARA_MATRIX_HOMESERVER_URL: http://127.0.0.1:8008
        run: |
          set -uo pipefail
          proofs=(
            "SYNARA_RUN_MATRIX_RUST_REACTION_LIVE live_native_reaction_paths_against_disposable_synapse_when_configured"
            "SYNARA_RUN_MATRIX_RUST_ATTACHMENT_LIVE live_native_attachment_send_against_disposable_synapse_when_configured"
            "SYNARA_RUN_MATRIX_RUST_POLL_LIVE live_native_poll_send_and_respond_against_disposable_synapse_when_configured"
            "SYNARA_RUN_MATRIX_RUST_RICH_MESSAGE_LIVE live_native_rich_message_send_against_disposable_synapse_when_configured"
            "SYNARA_RUN_MATRIX_RUST_THREAD_SEND_LIVE live_native_thread_send_against_disposable_synapse_when_configured"
            "SYNARA_RUN_MATRIX_RUST_RECEIPT_LIVE live_native_two_client_receipt_and_ordering_against_disposable_synapse_when_configured"
          )
          failed=()
          for proof in "${proofs[@]}"; do
            read -r flag filter <<<"$proof"
            echo "::group::${filter}"
            if scripts/synapse-integration.sh up &&
              (cd src-tauri && env "${flag}=1" cargo test --locked "$filter"); then
              :
            else
              failed+=("$filter")
            fi
            scripts/synapse-integration.sh reset || true
            echo "::endgroup::"
          done
          if (( ${#failed[@]} > 0 )); then
            printf 'Failed Synapse proof: %s\n' "${failed[@]}" >&2
            exit 1
          fi

      - name: Tear down disposable Synapse
        if: always()
        run: scripts/synapse-integration.sh reset

  # Nightly (or dispatch with packages=true): installable package smoke, which
  # also writes the release compiler caches from main so tag builds start warm.
  package-linux:
    name: Linux .deb package
    needs: [changes]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and npm download cache
        uses: ./.github/actions/setup-node

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96

      - name: Install Linux Tauri dependencies
        run: scripts/install-linux-tauri-dependencies.sh

      - name: Cache Rust compilation
        uses: ./.github/actions/setup-rust-cache
        with:
          family: release-linux-deb
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        run: npm run check:versions

      - name: Build Linux package
        run: npm run tauri build -- --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synara-linux-deb
          path: target/release/bundle/deb/Synara_*.deb
          if-no-files-found: error
          retention-days: 3

      - name: Upload Linux release binary for the Arch package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synara-linux-binary
          path: target/release/synara
          if-no-files-found: error
          retention-days: 1

  package-arch:
    name: Linux Arch package
    needs: [changes, package-linux]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container: archlinux:base-devel@sha256:8745817f349ed24373341ddb92776209eeec3f0364ea48f7f645ac5800d30a50
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Arch runtime dependencies
        run: scripts/install-arch-package-dependencies.sh

      - name: Download Linux release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: synara-linux-binary
          path: target/release

      - name: Build Arch pacman package
        run: scripts/build-arch-package.sh

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synara-linux-arch-pkg
          path: packaging/arch/synara-desktop-bin-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 3

  package-macos:
    name: macOS universal app bundle
    needs: [changes]
    if: needs.changes.outputs.packages == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and npm download cache
        uses: ./.github/actions/setup-node

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache universal macOS Rust compilation
        uses: ./.github/actions/setup-rust-cache
        with:
          family: release-macos
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        run: npm run check:versions

      # Same target as the signed release build, ad hoc signed, so this run
      # both smokes the bundle and warms the release-macos cache.
      - name: Build unsigned universal macOS app bundle
        run: npm run tauri build -- --target universal-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"entitlements":"Entitlements.adhoc.plist"}}}'
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Verify macOS app signature
        run: codesign --verify --all-architectures --deep --strict --verbose=2 target/universal-apple-darwin/release/bundle/macos/Synara.app

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synara-macos-app
          path: target/universal-apple-darwin/release/bundle/macos/Synara.app
          if-no-files-found: error
          retention-days: 3

  seed-apple-device:
    name: Seed iOS device Rust cache
    needs: [changes]
    if: needs.changes.outputs.packages == 'true'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned Apple toolchain
        run: test "$(xcodebuild -version)" = $'Xcode 26.6\nBuild version 17F113'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust 1.96 and Apple targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96
          components: llvm-tools-preview
          targets: aarch64-apple-ios

      - name: Cache Apple device Rust compilation
        uses: ./.github/actions/setup-rust-cache
        with:
          family: release-synara-core-apple-device
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate and validate device bindings and archives
        run: |
          scripts/generate-synara-core-swift.sh
          scripts/generate-synara-nse-core-swift.sh
        env:
          SYNARA_CORE_APPLE_SLICES: device
          SYNARA_NSE_CORE_APPLE_SLICES: device

  # Keep one snapshot per cache family so the release families stay inside the
  # repository cache limit instead of being evicted by older CI snapshots.
  prune-caches:
    name: Prune superseded Actions caches
    needs: [changes, rust-tests, ios-tests, package-linux, package-macos, seed-apple-device]
    if: always() && !cancelled() && needs.changes.outputs.packages == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Delete superseded cache snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prune-actions-caches.mjs

  quality-gate:
    name: Quality gate
    # Runs after job failures; skipped when the run was cancelled so a
    # superseded run cannot fail the required check on the surviving SHA.
    if: always() && !cancelled()
    needs:
      [
        changes,
        rust-lint,
        rust-tests,
        rust-dependency-audit,
        validate-frontend,
        ios-tests,
        ios-ui-tests,
        ios-compile,
        synapse-live,
        package-linux,
        package-arch,
        package-macos,
        seed-apple-device,
      ]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every scheduled job to pass or be skipped by scope
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # success = ran and passed; skipped = scoped out (OK). The scope job
          # itself must succeed.
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            let failed = false;
            for (const [job, { result }] of Object.entries(needs)) {
              const ok = job === "changes" ? result === "success" : ["success", "skipped"].includes(result);
              console.log(`${job}: ${result}`);
              if (!ok) failed = true;
            }
            if (failed) process.exit(1);
          '
