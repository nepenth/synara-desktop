name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "feature/matrix-rust-sdk-full-replacement", "feature/shared-native-core", "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job-level path filters (not workflow-level): required checks stay reported.
  # Skipped jobs do not block merge; quality-gate treats skipped as OK.
  changes:
    name: Detect CI scopes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      validate: ${{ steps.scope.outputs.validate }}
      validate_rust: ${{ steps.scope.outputs.validate_rust }}
      validate_rust_tests: ${{ steps.scope.outputs.validate_rust_tests }}
      rust_audit: ${{ steps.scope.outputs.rust_audit }}
      validate_frontend: ${{ steps.scope.outputs.validate_frontend }}
      ios: ${{ steps.scope.outputs.ios }}
      synapse_native_reactions: ${{ steps.scope.outputs.synapse_native_reactions }}
      synapse_native_attachments: ${{ steps.scope.outputs.synapse_native_attachments }}
      synapse_native_polls: ${{ steps.scope.outputs.synapse_native_polls }}
      synapse_native_rich_messages: ${{ steps.scope.outputs.synapse_native_rich_messages }}
      synapse_native_threads: ${{ steps.scope.outputs.synapse_native_threads }}
      synapse_native_receipts: ${{ steps.scope.outputs.synapse_native_receipts }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine which heavy CI jobs must run
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Full suite on push (main/release) and manual dispatch.
          # TEMPORARY (2026-08-17): ios is forced off until main is stable.
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "validate=true" >> "$GITHUB_OUTPUT"
            echo "validate_rust=true" >> "$GITHUB_OUTPUT"
            echo "validate_rust_tests=true" >> "$GITHUB_OUTPUT"
            echo "rust_audit=true" >> "$GITHUB_OUTPUT"
            echo "validate_frontend=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "synapse_native_reactions=true" >> "$GITHUB_OUTPUT"
            echo "synapse_native_attachments=true" >> "$GITHUB_OUTPUT"
            echo "synapse_native_polls=true" >> "$GITHUB_OUTPUT"
            echo "synapse_native_rich_messages=true" >> "$GITHUB_OUTPUT"
            echo "synapse_native_threads=true" >> "$GITHUB_OUTPUT"
            echo "synapse_native_receipts=true" >> "$GITHUB_OUTPUT"
            echo "CI scope: full (event=${GITHUB_EVENT_NAME})"
            exit 0
          fi

          if [[ -z "${BASE_SHA:-}" || -z "${HEAD_SHA:-}" ]]; then
            echo "validate=true" >> "$GITHUB_OUTPUT"
            echo "validate_rust=true" >> "$GITHUB_OUTPUT"
            echo "validate_rust_tests=true" >> "$GITHUB_OUTPUT"
            echo "rust_audit=true" >> "$GITHUB_OUTPUT"
            echo "validate_frontend=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "synapse_native_reactions=true" >> "$GITHUB_OUTPUT"
            echo "synapse_native_attachments=true" >> "$GITHUB_OUTPUT"
            echo "synapse_native_polls=true" >> "$GITHUB_OUTPUT"
            echo "synapse_native_rich_messages=true" >> "$GITHUB_OUTPUT"
            echo "synapse_native_threads=true" >> "$GITHUB_OUTPUT"
            echo "synapse_native_receipts=true" >> "$GITHUB_OUTPUT"
            echo "CI scope: full (missing PR SHAs)"
            exit 0
          fi

          # Desktop / runtime validation (Node + Rust Tauri shell + synara frontend).
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/ci.yml \
            .node-version \
            config.json \
            package.json \
            package-lock.json \
            scripts \
            crates \
            src-tauri \
            synara; then
            echo "validate=false" >> "$GITHUB_OUTPUT"
            VALIDATE=false
          else
            echo "validate=true" >> "$GITHUB_OUTPUT"
            VALIDATE=true
          fi

          # Finer scopes so Rust and frontend Validate can run in parallel jobs
          # without dropping any gate that currently runs when validate=true.
          if [[ "$VALIDATE" == "true" ]]; then
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              .github/workflows/ci.yml \
              crates \
              src-tauri \
              rust-toolchain.toml; then
              echo "validate_rust=false" >> "$GITHUB_OUTPUT"
              VALIDATE_RUST=false
            else
              echo "validate_rust=true" >> "$GITHUB_OUTPUT"
              VALIDATE_RUST=true
            fi
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              .github/workflows/ci.yml \
              .node-version \
              config.json \
              package.json \
              package-lock.json \
              scripts \
              synara; then
              echo "validate_frontend=false" >> "$GITHUB_OUTPUT"
              VALIDATE_FRONTEND=false
            else
              echo "validate_frontend=true" >> "$GITHUB_OUTPUT"
              VALIDATE_FRONTEND=true
            fi
            # Safety: if only one side matched oddly, still run both when validate=true
            # and neither finer flag fired (should not happen).
            if [[ "$VALIDATE_RUST" == "false" && "$VALIDATE_FRONTEND" == "false" ]]; then
              echo "validate_rust=true" >> "$GITHUB_OUTPUT"
              echo "validate_frontend=true" >> "$GITHUB_OUTPUT"
              VALIDATE_RUST=true
              VALIDATE_FRONTEND=true
            fi
          else
            echo "validate_rust=false" >> "$GITHUB_OUTPUT"
            echo "validate_frontend=false" >> "$GITHUB_OUTPUT"
            VALIDATE_RUST=false
            VALIDATE_FRONTEND=false
          fi

          # cargo test is the long desktop job. On PRs targeting the shared-core
          # development branch, mechanical app-harness moves are covered by
          # `clippy --all-targets` (that compiles tests). Skip cargo test unless
          # a live Synapse proof or send/timeline product command changed.
          # Full cargo test still runs on push to main/release and dispatch.
          if [[ "$VALIDATE_RUST" != "true" ]]; then
            echo "validate_rust_tests=false" >> "$GITHUB_OUTPUT"
            VALIDATE_RUST_TESTS=false
          elif [[ "${GITHUB_BASE_REF:-}" == "feature/shared-native-core" ]] && git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            src-tauri/src/matrix/send/product_commands.rs \
            src-tauri/src/matrix/send/live_synapse_proof \
            src-tauri/src/matrix/timeline/live.rs \
            src-tauri/src/matrix/timeline/live_synapse_proof \
            src-tauri/src/matrix/timeline/product_commands.rs; then
            echo "validate_rust_tests=false" >> "$GITHUB_OUTPUT"
            VALIDATE_RUST_TESTS=false
          else
            echo "validate_rust_tests=true" >> "$GITHUB_OUTPUT"
            VALIDATE_RUST_TESTS=true
          fi

          # cargo-audit only when lockfiles or the audit allowlist can change.
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/ci.yml \
            Cargo.lock \
            Cargo.toml \
            src-tauri/Cargo.lock \
            src-tauri/Cargo.toml \
            crates/synara-core/Cargo.toml \
            .cargo/audit.toml; then
            echo "rust_audit=false" >> "$GITHUB_OUTPUT"
            RUST_AUDIT=false
          else
            echo "rust_audit=true" >> "$GITHUB_OUTPUT"
            RUST_AUDIT=true
          fi

          # iOS simulator suite. Mechanical P1 moves under
          # crates/synara-core/src/app/ stay on validate-rust.
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            rust-toolchain.toml \
            Cargo.toml \
            Cargo.lock \
            crates/synara-core/Cargo.toml \
            crates/synara-core/build.rs \
            crates/synara-core/src/lib.rs \
            crates/synara-core/src/synara_core.udl \
            crates/synara-core/src/ffi.rs \
            crates/synara-core/src/session_projection_ffi.rs \
            crates/synara-core/src/shared_core_ffi.rs \
            crates/synara-core-bindgen \
            .github/workflows/ci.yml \
            scripts/generate-synara-core-swift.sh \
            scripts/check-synara-core-swift-scaffold.mjs \
            synara-ios; then
            echo "ios=false" >> "$GITHUB_OUTPUT"
            IOS=false
          else
            echo "ios=true" >> "$GITHUB_OUTPUT"
            IOS=true
          fi

          # Two-client Synapse integration (JS runtime scenarios).
          # src-tauri-only Matrix harness work does not require this job.
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/ci.yml \
            package.json \
            package-lock.json \
            scripts/synapse-integration.sh \
            scripts/__tests__ \
            synara; then
            SYNAPSE=false
          else
            SYNAPSE=true
          fi

          # Native V-SEND.2 reaction owner proof against disposable Synapse.
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/ci.yml \
            scripts/synapse-integration.sh \
            integration/synapse \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            src-tauri/src/matrix/timeline/live.rs \
            src-tauri/src/matrix/timeline/live_synapse_proof \
            src-tauri/src/matrix/timeline/product_commands.rs; then
            echo "synapse_native_reactions=false" >> "$GITHUB_OUTPUT"
            SYNAPSE_NATIVE_REACTIONS=false
          else
            echo "synapse_native_reactions=true" >> "$GITHUB_OUTPUT"
            SYNAPSE_NATIVE_REACTIONS=true
          fi

          # Native V-SEND.1 attachment owner proof against disposable Synapse.
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/ci.yml \
            scripts/synapse-integration.sh \
            integration/synapse \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            src-tauri/src/matrix/send/product_commands.rs \
            src-tauri/src/matrix/send/live_synapse_proof \
            src-tauri/src/matrix/auth/product.rs; then
            echo "synapse_native_attachments=false" >> "$GITHUB_OUTPUT"
            SYNAPSE_NATIVE_ATTACHMENTS=false
          else
            echo "synapse_native_attachments=true" >> "$GITHUB_OUTPUT"
            SYNAPSE_NATIVE_ATTACHMENTS=true
          fi

          # Native V-SEND.3 poll owner proof against disposable Synapse.
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/ci.yml \
            scripts/synapse-integration.sh \
            integration/synapse \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            src-tauri/src/matrix/send/product_commands.rs \
            src-tauri/src/matrix/send/live_synapse_proof \
            src-tauri/src/matrix/auth/product.rs; then
            echo "synapse_native_polls=false" >> "$GITHUB_OUTPUT"
            SYNAPSE_NATIVE_POLLS=false
          else
            echo "synapse_native_polls=true" >> "$GITHUB_OUTPUT"
            SYNAPSE_NATIVE_POLLS=true
          fi

          # Native V-SEND.4 rich composer message proof against disposable Synapse.
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/ci.yml \
            scripts/synapse-integration.sh \
            integration/synapse \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            src-tauri/src/matrix/send/live_synapse_proof \
            src-tauri/src/matrix/auth/product.rs; then
            echo "synapse_native_rich_messages=false" >> "$GITHUB_OUTPUT"
            SYNAPSE_NATIVE_RICH_MESSAGES=false
          else
            echo "synapse_native_rich_messages=true" >> "$GITHUB_OUTPUT"
            SYNAPSE_NATIVE_RICH_MESSAGES=true
          fi

          # Native V-SEND.5 thread send/relation proof against disposable Synapse.
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/ci.yml \
            scripts/synapse-integration.sh \
            integration/synapse \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            src-tauri/src/matrix/send/live_synapse_proof \
            src-tauri/src/matrix/auth/product.rs; then
            echo "synapse_native_threads=false" >> "$GITHUB_OUTPUT"
            SYNAPSE_NATIVE_THREADS=false
          else
            echo "synapse_native_threads=true" >> "$GITHUB_OUTPUT"
            SYNAPSE_NATIVE_THREADS=true
          fi

          # Native two-client receipt + ordered-delivery proof against disposable
          # Synapse (replaces the retired js-sdk two-client harness).
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/ci.yml \
            scripts/synapse-integration.sh \
            integration/synapse \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            src-tauri/src/matrix/timeline/live_synapse_proof \
            src-tauri/src/matrix/auth/product.rs; then
            echo "synapse_native_receipts=false" >> "$GITHUB_OUTPUT"
            SYNAPSE_NATIVE_RECEIPTS=false
          else
            echo "synapse_native_receipts=true" >> "$GITHUB_OUTPUT"
            SYNAPSE_NATIVE_RECEIPTS=true
          fi

          echo "CI scope: validate=${VALIDATE} rust=${VALIDATE_RUST:-n/a} rust_tests=${VALIDATE_RUST_TESTS:-n/a} rust_audit=${RUST_AUDIT:-n/a} frontend=${VALIDATE_FRONTEND:-n/a} ios=${IOS} synapse=${SYNAPSE} synapse_native_reactions=${SYNAPSE_NATIVE_REACTIONS} synapse_native_attachments=${SYNAPSE_NATIVE_ATTACHMENTS} synapse_native_polls=${SYNAPSE_NATIVE_POLLS} synapse_native_rich_messages=${SYNAPSE_NATIVE_RICH_MESSAGES} synapse_native_threads=${SYNAPSE_NATIVE_THREADS} synapse_native_receipts=${SYNAPSE_NATIVE_RECEIPTS}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | head -80 || true

  validate-rust:
    name: Validate Rust desktop shell
    needs: [changes]
    if: needs.changes.outputs.validate_rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.93
        with:
          toolchain: 1.93
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
          shared-key: validate-rust-desktop

      - name: Install Linux Tauri dependencies
        run: scripts/install-linux-tauri-dependencies.sh

      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Check shared Rust workspace formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust desktop shell
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Lint shared Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check Rust desktop shell
        run: cargo check --locked
        working-directory: src-tauri

      - name: Check shared Rust workspace
        run: cargo check --locked --workspace

      - name: Test Rust desktop shell
        if: needs.changes.outputs.validate_rust_tests == 'true'
        run: cargo test --locked
        working-directory: src-tauri

      - name: Test shared Rust workspace
        if: needs.changes.outputs.validate_rust_tests == 'true'
        run: cargo test --locked --workspace

      - name: Check Matrix integration boundaries
        # Runs on any src-tauri diff (the Node job only fires on frontend changes);
        # node -- run directly so no npm ci / node_modules is required here.
        run: node scripts/check-matrix-boundaries.mjs

  rust-dependency-audit:
    name: Rust dependency audit (cargo-audit)
    needs: [changes]
    if: needs.changes.outputs.rust_audit == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.93
        with:
          toolchain: 1.93

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # .cargo/audit.toml holds the short documented allowlist (quick-xml via
      # plist=tauri-bundler, fixed upstream at >=0.41.0, unreachable in-chain).
      - name: Audit Rust dependencies (RustSec advisory DB)
        run: cargo audit
        working-directory: src-tauri

      - name: Audit shared Rust workspace dependencies (RustSec advisory DB)
        run: cargo audit
  validate-frontend:
    name: Validate Node desktop runtime
    needs: [changes]
    if: needs.changes.outputs.validate_frontend == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            synara/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Install Chromium for timeline layout tests
        run: npx playwright install --with-deps chromium
        working-directory: synara

      - name: Check repository layout
        run: npm run check:repo-layout

      - name: Check version metadata
        run: npm run check:versions

      - name: Check Matrix integration boundaries
        run: npm run check:matrix-boundaries

      - name: Check Matrix Rust SDK architectural guardrails
        run: npm run check:matrix-rust-guardrails

      - name: Check reliability delivery gates
        run: npm run check:quality-gates

      - name: Check disposable Synapse harness
        run: npm run check:synapse-harness

      - name: Check production smoke contract
        run: npm run check:production-smoke

      - name: Check release updater workflow contract
        run: npm run check:release-updater

      - name: Test repository delivery scripts
        run: node --test scripts/__tests__/*.test.mjs

      - name: Typecheck desktop runtime
        run: npm run typecheck
        working-directory: synara

      - name: Typecheck runtime modernization surface
        run: npm run typecheck:modernization
        working-directory: synara

      - name: Test runtime modernization surface
        run: npm run test:modernization
        working-directory: synara

      - name: Test real-layout timeline scrolling
        run: npm run test:browser:timeline
        working-directory: synara

      - name: Check runtime lint
        run: npm run check:eslint
        working-directory: synara

      - name: Check runtime formatting
        run: npm run check:prettier
        working-directory: synara

      - name: Check production dependency advisories
        run: npm run check:security
        working-directory: synara

  ios-tests:
    name: iOS simulator tests
    needs: [changes]
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    # Bounded cap allows post-test output/upload.
    # 90m: S3b + UniFFI merge-ups exceed the 60m GitHub default (cancelled at ~61m).
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.93 and Apple targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.93
        with:
          toolchain: 1.93
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check SynaraCore Swift scaffold
        run: node scripts/check-synara-core-swift-scaffold.mjs

      - name: Build and run unsigned simulator tests
        run: scripts/ci-build.sh
        working-directory: synara-ios
        env:
          RUN_IOS_TESTS: "1"

      - name: Upload iOS result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: /private/tmp/synara-ios-results/*.xcresult
          if-no-files-found: warn
          retention-days: 14

  synapse-native-reactions:
    name: Synapse native reaction proof
    needs: [changes]
    if: needs.changes.outputs.synapse_native_reactions == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.93
        with:
          toolchain: 1.93

      - name: Install Linux Tauri dependencies
        run: scripts/install-linux-tauri-dependencies.sh

      - name: Start disposable Synapse
        run: scripts/synapse-integration.sh up

      - name: Prove native reaction toggle/ensure/redact against Synapse
        working-directory: src-tauri
        env:
          SYNARA_RUN_MATRIX_RUST_REACTION_LIVE: "1"
          SYNARA_MATRIX_HOMESERVER_URL: http://127.0.0.1:8008
        run: >
          cargo test --locked
          live_native_reaction_paths_against_disposable_synapse_when_configured
          -- --nocapture

      - name: Tear down disposable Synapse
        if: always()
        run: scripts/synapse-integration.sh reset

  synapse-native-attachments:
    name: Synapse native attachment proof
    needs: [changes]
    if: needs.changes.outputs.synapse_native_attachments == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.93
        with:
          toolchain: 1.93

      - name: Install Linux Tauri dependencies
        run: scripts/install-linux-tauri-dependencies.sh

      - name: Start disposable Synapse
        run: scripts/synapse-integration.sh up

      - name: Prove native attachment send against Synapse
        working-directory: src-tauri
        env:
          SYNARA_RUN_MATRIX_RUST_ATTACHMENT_LIVE: "1"
          SYNARA_MATRIX_HOMESERVER_URL: http://127.0.0.1:8008
        run: >
          cargo test --locked
          live_native_attachment_send_against_disposable_synapse_when_configured
          -- --nocapture

      - name: Tear down disposable Synapse
        if: always()
        run: scripts/synapse-integration.sh reset

  synapse-native-polls:
    name: Synapse native poll proof
    needs: [changes]
    if: needs.changes.outputs.synapse_native_polls == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.93
        with:
          toolchain: 1.93

      - name: Install Linux Tauri dependencies
        run: scripts/install-linux-tauri-dependencies.sh

      - name: Start disposable Synapse
        run: scripts/synapse-integration.sh up

      - name: Prove native poll start/respond against Synapse
        working-directory: src-tauri
        env:
          SYNARA_RUN_MATRIX_RUST_POLL_LIVE: "1"
          SYNARA_MATRIX_HOMESERVER_URL: http://127.0.0.1:8008
        run: >
