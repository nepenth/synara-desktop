name: Rust Cache Benchmark

on:
  workflow_dispatch:

concurrency:
  group: build-cache-benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Host NSE baseline and production-sized Kache
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96

      - name: Install isolated pinned Kache
        uses: kunobi-ninja/kache-action@1a33fb2ff51be23eb9e87abeae6edb65be78f71c # pinned 2026-10-03
        with:
          version: v0.28.1
          github-cache: "false"
          save-cache: "false"
          pr-comment: "false"
          job-summary: "false"
          strict: "true"
          cache-executables: "true"
          cache-dir: ${{ runner.temp }}/kache-action-trial
          max-size: 5GiB

      - name: Compare fresh NSE builds with a local compiler cache
        # Use available disk headroom with the filesystem reserve, without pilot caps.
        run: node scripts/benchmark-rust-cache.mjs --output "$RUNNER_TEMP/build-cache-benchmark.json"

      - name: Upload benchmark measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-cache-benchmark
          path: ${{ runner.temp }}/build-cache-benchmark.json
          if-no-files-found: warn
          retention-days: 7
