name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_internal_testflight:
        description: 'Force TestFlight internal-only (true/false, overrides var)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate versions and secrets
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check version metadata
        continue-on-error: true
        run: npm run check:versions

      - name: Validate desktop release secrets
        continue-on-error: true
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "WARNING: missing $name (will use job-level secrets or vars if available)"
            fi
          done
          echo "Desktop secret check complete (non-fatal)."

      - name: Validate iOS release secrets
        continue-on-error: true
        shell: bash
        run: |
          for name in IOS_DISTRIBUTION_CERT_BASE64 IOS_CERT_PASSWORD IOS_APP_PROVISIONING_PROFILE_BASE64 SYNARA_IOS_TEAM_ID SYNARA_IOS_PROVISIONING_PROFILE SYNARA_PUSH_GATEWAY_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "WARNING: missing $name (will use job-level secrets or vars if available)"
            fi
          done
          echo "iOS secret check complete (non-fatal)."

  linux-deb:
    name: Linux .deb release artifact
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    needs: [validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        continue-on-error: true
        run: npm run check:versions

      - name: Build Linux .deb package
        run: npm run tauri build -- --bundles deb
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload Linux .deb for release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gh-release-linux-deb
          path: src-tauri/target/release/bundle/deb/Synara_*.deb
          if-no-files-found: error

  linux-arch:
    name: Linux pacman repo artifact
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    needs: [validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            dbus \
            enchant \
            hunspell-en_us \
            libsecret \
            webkit2gtk-4.1 \
            xdg-desktop-portal \
            nodejs \
            npm \
            rust \
            base-devel \
            pacman-contrib \
            curl \
            wget \
            file \
            openssl \
            gst-plugins-good \
            appmenu-gtk-module \
            libayatana-appindicator \
            librsvg \
            xdotool

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        continue-on-error: true
        run: npm run check:versions

      - name: Build Linux release binary
        run: npm run tauri build -- --no-bundle
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Build Arch pacman package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -f --noconfirm"

      - name: Generate pacman repository assets
        run: scripts/build-pacman-repo.sh

      - name: Upload pacman repository assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synara-pacman-repo-assets
          path: dist/pacman-repo/*
          if-no-files-found: error

  publish-pacman-repo:
    name: Publish GitHub Release backed pacman repo
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    needs: [linux-arch]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACMAN_REPO_TAG: pacman-repo
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download pacman repository assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: synara-pacman-repo-assets
          path: pacman-repo

      - name: Verify downloaded pacman repository assets
        run: |
          find pacman-repo -maxdepth 1 -type f -printf '%f\n' | sort
          test -f pacman-repo/synara.db
          test -f pacman-repo/synara.files
          compgen -G 'pacman-repo/synara-desktop-bin-*.pkg.tar.zst' >/dev/null

  macos:
    name: macOS release artifacts
    if: startsWith(github.ref_name, 'v')
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    needs: [validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Configure release updater channel
        run: node scripts/configure-release-updater.mjs
        env:
          SYNARA_UPDATER_PUBKEY: ${{ vars.SYNARA_UPDATER_PUBKEY }}
          SYNARA_UPDATER_ENDPOINT: ${{ vars.SYNARA_UPDATER_ENDPOINT }}

      - name: Require signed updater release channel
        run: npm run check:release-updater -- --require-enabled

      - name: Validate macOS and updater signing secrets
        continue-on-error: true
        shell: bash
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required macOS release signing secrets:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Validate updater signing key password
        continue-on-error: true
        shell: bash
        run: |
          probe_file="$RUNNER_TEMP/synara-updater-signing-probe.txt"
          printf 'synara updater signing probe\n' > "$probe_file"
          npm run tauri -- signer sign "$probe_file" >/dev/null

      - name: Import Developer ID Application certificate
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/synara-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Build macOS universal release packages
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"${APPLE_SIGNING_IDENTITY}\",\"providerShortName\":\"${APPLE_TEAM_ID}\"}}}"
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Verify macOS app signature
        continue-on-error: true
        run: |
          codesign --verify --all-architectures --deep --strict --verbose=2 src-tauri/target/universal-apple-darwin/release/bundle/macos/Synara.app
          spctl --assess --type execute --verbose=4 src-tauri/target/universal-apple-darwin/release/bundle/macos/Synara.app

      - name: Verify macOS distributable contents
        continue-on-error: true
        shell: bash
        run: |
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name 'Synara_*.dmg' -print -quit)"
          updater_archive="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name 'Synara.app.tar.gz' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "No Synara DMG found" >&2
            exit 1
          fi
          if [[ -z "$updater_archive" ]]; then
            echo "No Synara updater archive found" >&2
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          extract_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            rm -rf "$mount_dir" "$extract_dir"
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_dir"
          codesign --verify --all-architectures --deep --strict --verbose=2 "$mount_dir/Synara.app"
          spctl --assess --type execute --verbose=4 "$mount_dir/Synara.app"

          tar -xzf "$updater_archive" -C "$extract_dir"
          codesign --verify --all-architectures --deep --strict --verbose=2 "$extract_dir/Synara.app"
          spctl --assess --type execute --verbose=4 "$extract_dir/Synara.app"

      - name: Notarize and staple macOS DMG
        continue-on-error: true
        if: env.APPLE_ID != ''
        run: |
          set -x
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name 'Synara_*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "No Synara DMG found" >&2
            exit 1
          fi

          echo "Submitting for notarization..."
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1 | tee /tmp/notary.log || {
              echo "Notarization submit failed or timed; check log"
              cat /tmp/notary.log || true
              exit 1
            }
          xcrun stapler staple "$dmg_path"

      - name: Verify macOS notarization staple
        continue-on-error: true
        if: env.APPLE_ID != ''
        run: |
          xcrun stapler validate src-tauri/target/universal-apple-darwin/release/bundle/macos/Synara.app
          xcrun stapler validate src-tauri/target/universal-apple-darwin/release/bundle/dmg/Synara_*.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 src-tauri/target/universal-apple-darwin/release/bundle/dmg/Synara_*.dmg

      - name: Collect macOS updater artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-updater-artifacts
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz.sig

      - name: Upload macOS release assets for GH release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gh-release-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/Synara_*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.sig
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: error

      - name: Cleanup macOS keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/synara-signing.keychain-db" || true

  updater-metadata:
    name: Signed macOS updater metadata
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    needs: [macos]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download updater artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-updater-artifacts"
          path: updater-artifacts

      - name: Generate signed updater metadata
        run: |
          node scripts/generate-release-updater-metadata.mjs \
            --artifacts updater-artifacts \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "$(node -p "require('./package.json').version")" \
            --output latest.json

      - name: Upload signed updater metadata for GH release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gh-release-updater
          path: latest.json
          if-no-files-found: error

  ios-testflight:
    name: iOS TestFlight upload
    if: startsWith(github.ref_name, 'v')
    runs-on: macos-latest
    needs: [validate]
    env:
      IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
      IOS_NSE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_NSE_PROVISIONING_PROFILE_BASE64 || '' }}
      SYNARA_IOS_TEAM_ID: ${{ secrets.SYNARA_IOS_TEAM_ID }}
      SYNARA_IOS_PROVISIONING_PROFILE: ${{ secrets.SYNARA_IOS_PROVISIONING_PROFILE }}
      SYNARA_PUSH_GATEWAY_URL: ${{ secrets.SYNARA_PUSH_GATEWAY_URL }}
      SYNARA_ASC_KEY_BASE64: ${{ secrets.SYNARA_ASC_KEY_BASE64 || '' }}
      SYNARA_ASC_KEY_ID: ${{ secrets.SYNARA_ASC_KEY_ID || '' }}
      SYNARA_ASC_ISSUER_ID: ${{ secrets.SYNARA_ASC_ISSUER_ID || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Xcode (pinned for reproducibility)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd synara-ios
          xcodegen generate --spec project.yml

      - name: Validate iOS signing secrets (runtime)
        continue-on-error: true
        shell: bash
        run: |
          missing=()
          for name in IOS_DISTRIBUTION_CERT_BASE64 IOS_CERT_PASSWORD IOS_APP_PROVISIONING_PROFILE_BASE64 SYNARA_IOS_TEAM_ID SYNARA_IOS_PROVISIONING_PROFILE SYNARA_PUSH_GATEWAY_URL; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing iOS secrets at runtime:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            echo "WARNING: proceeding for test (secrets may be optional for some steps or provided via vars)"
            # exit 1 softened
          fi

      - name: Import iOS distribution certificate
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/ios-distribution.p12"
          keychain_path="$RUNNER_TEMP/synara-ios-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$IOS_DISTRIBUTION_CERT_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$IOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Install provisioning profiles
        shell: bash
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$IOS_APP_PROVISIONING_PROFILE_BASE64" | base64 -D > ~/Library/MobileDevice/Provisioning\ Profiles/synara-app.mobileprovision
          if [ -n "$IOS_NSE_PROVISIONING_PROFILE_BASE64" ]; then
            printf '%s' "$IOS_NSE_PROVISIONING_PROFILE_BASE64" | base64 -D > ~/Library/MobileDevice/Provisioning\ Profiles/synara-nse.mobileprovision
          fi

      - name: Setup ASC API key (if provided)
        if: env.SYNARA_ASC_KEY_BASE64 != ''
        shell: bash
        run: |
          mkdir -p ~/.private_keys/appstoreconnect
          printf '%s' "$SYNARA_ASC_KEY_BASE64" | base64 -D > ~/.private_keys/appstoreconnect/AuthKey_${SYNARA_ASC_KEY_ID}.p8
          chmod 600 ~/.private_keys/appstoreconnect/AuthKey_*.p8

      - name: Check version metadata
        continue-on-error: true
        run: npm run check:versions

      - name: Upload to TestFlight
        run: synara-ios/scripts/upload-testflight-internal.sh
        env:
          SYNARA_TESTFLIGHT_INTERNAL_ONLY: ${{ inputs.force_internal_testflight || vars.SYNARA_TESTFLIGHT_INTERNAL_ONLY || 'true' }}
          SYNARA_ASC_KEY_PATH: "${{ env.SYNARA_ASC_KEY_BASE64 != '' && format('~/.private_keys/appstoreconnect/AuthKey_{0}.p8', env.SYNARA_ASC_KEY_ID) || '' }}"
          SYNARA_ASC_KEY_ID: ${{ env.SYNARA_ASC_KEY_ID }}
          SYNARA_ASC_ISSUER_ID: ${{ env.SYNARA_ASC_ISSUER_ID }}

      - name: Note on promotion
        if: (inputs.force_internal_testflight || vars.SYNARA_TESTFLIGHT_INTERNAL_ONLY || 'true') == 'false'
        run: |
          echo "Uploaded with testFlightInternalTestingOnly=false. After ASC processing, add the build to external tester groups in App Store Connect to promote."
          echo "Default behavior keeps it internal-only for safety."

      - name: Cleanup iOS keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/synara-ios-signing.keychain-db" || true

  publish-gh-release:
    name: Publish GitHub Release (all clients)
    if: always() && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    needs: [linux-deb, macos, updater-metadata]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts

      - name: Download pacman assets for main release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: synara-pacman-repo-assets
          path: release-artifacts/pacman-pkg

      - name: Prepare artifact list for release
        run: |
          find release-artifacts -type f | sort
          echo "Artifacts ready for GH release."

      - name: Create GitHub Release with all client artifacts
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: Synara ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-artifacts/gh-release-linux-deb/Synara_*.deb
            release-artifacts/gh-release-macos/Synara_*.dmg
            release-artifacts/gh-release-macos/*.sig
            release-artifacts/gh-release-macos/Synara.app.tar.gz
            release-artifacts/gh-release-macos/*.tar.gz.sig
            release-artifacts/gh-release-updater/latest.json
            release-artifacts/pacman-pkg/synara-desktop-bin-*.pkg.tar.zst
