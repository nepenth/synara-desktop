name: Desktop Package Smoke

on:
  push:
    branches: ["release/**"]
    paths:
      - ".github/workflows/desktop-package-smoke.yml"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - "config.json"
      - "scripts/**"
      - "packaging/arch/**"
      - "src-tauri/**"
      - "synara/**"
  pull_request:
    branches: [main, "release/**"]
    paths:
      - ".github/workflows/desktop-package-smoke.yml"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - "config.json"
      - "scripts/**"
      - "packaging/arch/**"
      - "src-tauri/**"
      - "synara/**"
  workflow_dispatch:

concurrency:
  group: package-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-deb:
    name: Linux .deb package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        run: npm run check:versions

      - name: Build Linux package
        run: npm run tauri build -- --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synara-linux-deb
          path: src-tauri/target/release/bundle/deb/Synara_*.deb
          if-no-files-found: error
          retention-days: 7

  linux-arch:
    name: Linux Arch package
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            dbus \
            enchant \
            hunspell-en_us \
            libsecret \
            webkit2gtk-4.1 \
            xdg-desktop-portal \
            nodejs \
            npm \
            rust \
            base-devel \
            curl \
            wget \
            file \
            openssl \
            gst-plugins-good \
            appmenu-gtk-module \
            libayatana-appindicator \
            librsvg \
            xdotool

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        run: npm run check:versions

      - name: Build Linux release binary
        run: npm run tauri build -- --no-bundle --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Build Arch pacman package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -f --noconfirm"

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synara-linux-arch-pkg
          path: packaging/arch/synara-desktop-bin-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  macos-app:
    name: macOS app bundle
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        run: npm run check:versions

      - name: Build macOS app bundle
        run: npm run tauri build -- --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Verify macOS app signature
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/Synara.app

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synara-macos-app
          path: src-tauri/target/release/bundle/macos/Synara.app
          if-no-files-found: error
          retention-days: 7
