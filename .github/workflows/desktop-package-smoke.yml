name: Desktop Package Smoke

on:
  push:
    branches: ["release/**"]
    paths:
      - ".github/workflows/desktop-package-smoke.yml"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - "config.json"
      - "scripts/**"
      - "packaging/arch/**"
      - "src-tauri/**"
      - "synara/**"
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

concurrency:
  group: package-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect package-sensitive changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether packages must be built
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/desktop-package-smoke.yml \
            .node-version \
            config.json \
            package.json \
            package-lock.json \
            packaging/arch \
            scripts \
            src-tauri \
            synara; then
            echo "packages=false" >> "$GITHUB_OUTPUT"
          else
            echo "packages=true" >> "$GITHUB_OUTPUT"
          fi

  linux-deb:
    name: Linux .deb package
    needs: [changes]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-22

      - name: Install Linux Tauri dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        run: npm run check:versions

      - name: Build Linux package
        run: npm run tauri build -- --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synara-linux-deb
          path: src-tauri/target/release/bundle/deb/Synara_*.deb
          if-no-files-found: error
          retention-days: 7

  linux-arch:
    name: Linux Arch package
    needs: [changes]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            dbus \
            enchant \
            hunspell-en_us \
            libsecret \
            webkit2gtk-4.1 \
            xdg-desktop-portal \
            nodejs \
            npm \
            rust \
            base-devel \
            curl \
            wget \
            file \
            openssl \
            gst-plugins-good \
            appmenu-gtk-module \
            libayatana-appindicator \
            librsvg \
            xdotool

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        run: npm run check:versions

      - name: Build Linux release binary
        run: npm run tauri build -- --no-bundle --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Build Arch pacman package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -f --noconfirm"

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synara-linux-arch-pkg
          path: packaging/arch/synara-desktop-bin-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  macos-app:
    name: macOS app bundle
    needs: [changes]
    if: needs.changes.outputs.packages == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-22

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        run: npm run check:versions

      - name: Build macOS app bundle
        run: npm run tauri build -- --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Verify macOS app signature
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/Synara.app

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synara-macos-app
          path: src-tauri/target/release/bundle/macos/Synara.app
          if-no-files-found: error
          retention-days: 7

  package-gate:
    name: Desktop package gate
    if: always()
    needs: [changes, linux-deb, linux-arch, macos-app]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable package build
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PACKAGES_REQUIRED: ${{ needs.changes.outputs.packages }}
          DEB_RESULT: ${{ needs.linux-deb.result }}
          ARCH_RESULT: ${{ needs.linux-arch.result }}
          MACOS_RESULT: ${{ needs.macos-app.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Package change detection: $CHANGES_RESULT" >&2
            exit 1
          fi

          if [[ "$PACKAGES_REQUIRED" != "true" ]]; then
            echo "No package-sensitive files changed; package builds are not required."
            exit 0
          fi

          if [[ "$DEB_RESULT" != "success" || "$ARCH_RESULT" != "success" || "$MACOS_RESULT" != "success" ]]; then
            echo "Linux .deb package: $DEB_RESULT" >&2
            echo "Linux Arch package: $ARCH_RESULT" >&2
            echo "macOS app bundle: $MACOS_RESULT" >&2
            exit 1
          fi
