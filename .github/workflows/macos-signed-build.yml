name: macOS Signed Build

on:
  workflow_dispatch:

concurrency:
  group: macos-signed-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos-signed-build:
    name: Signed and notarized DMG
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: write
    environment:
      name: production-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and npm download cache
        uses: ./.github/actions/setup-node

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; toolchain 1.96
        with:
          toolchain: 1.96
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache universal macOS Rust compilation
        uses: ./.github/actions/setup-rust-cache
        with:
          family: release-macos
          save-cache: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

      - name: Install desktop dependencies
        run: npm ci

      - name: Install runtime dependencies
        run: npm ci
        working-directory: synara

      - name: Check version metadata
        run: npm run check:versions

      - name: Validate macOS signing secrets
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID \
            MACOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required macOS signing secrets:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Import Developer ID Application certificate
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/synara-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Validate and prepare Developer ID notification profile
        shell: bash
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          profile_path="$RUNNER_TEMP/synara-desktop.provisionprofile"
          entitlements_path="$RUNNER_TEMP/synara-desktop-signing.entitlements"
          printf '%s' "$MACOS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$profile_path"
          python3 scripts/check-macos-provisioning-profile.py "$profile_path" \
            --team "$APPLE_TEAM_ID" --identity "$APPLE_SIGNING_IDENTITY" \
            --entitlements src-tauri/Entitlements.plist --entitlements-output "$entitlements_path"
          echo "SYNARA_MACOS_PROVISIONING_PROFILE=$profile_path" >> "$GITHUB_ENV"
          echo "SYNARA_MACOS_SIGNING_ENTITLEMENTS=$entitlements_path" >> "$GITHUB_ENV"

      - name: Build signed macOS DMG
        shell: bash
        run: |
          config_json="$(node - <<'NODE'
          process.stdout.write(JSON.stringify({ bundle: { createUpdaterArtifacts: false, macOS: {
            signingIdentity: process.env.APPLE_SIGNING_IDENTITY,
            providerShortName: process.env.APPLE_TEAM_ID,
            entitlements: process.env.SYNARA_MACOS_SIGNING_ENTITLEMENTS,
            files: { "embedded.provisionprofile": process.env.SYNARA_MACOS_PROVISIONING_PROFILE },
          } } }));
          NODE
          )"
          npm run tauri build -- --target universal-apple-darwin --bundles dmg --config "$config_json"
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS app signature
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg_path="$(find target/universal-apple-darwin/release/bundle/dmg -name 'Synara_*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "No Synara DMG found" >&2
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"; rmdir "$mount_dir"' EXIT

          codesign --verify --deep --strict --verbose=2 "$mount_dir/Synara.app"
          python3 scripts/check-macos-provisioning-profile.py "$SYNARA_MACOS_PROVISIONING_PROFILE" \
            --team "$APPLE_TEAM_ID" --identity "$APPLE_SIGNING_IDENTITY" --app "$mount_dir/Synara.app"
          spctl --assess --type execute --verbose=4 "$mount_dir/Synara.app"

      - name: Notarize and staple macOS DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg_path="$(find target/universal-apple-darwin/release/bundle/dmg -name 'Synara_*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "No Synara DMG found" >&2
            exit 1
          fi

          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"

      - name: Cleanup macOS signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/synara-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f -- \
            "$RUNNER_TEMP/developer-id-application.p12" \
            "$RUNNER_TEMP/synara-desktop.provisionprofile" \
            "$RUNNER_TEMP/synara-desktop-signing.entitlements"

      - name: Upload signed macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synara-macos-signed-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/Synara_*.dmg
          if-no-files-found: error
          retention-days: 7
