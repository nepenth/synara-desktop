name: Seed unsigned release build caches

on:
  workflow_dispatch:
    inputs:
      family:
        description: Release graph to seed (main writes; other branches only read)
        type: choice
        options: [macos-universal, ios-device]
        required: true

permissions:
  contents: read

concurrency:
  group: build-cache-seed-${{ inputs.family }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-universal:
    if: inputs.family == 'macos-universal'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and npm download cache
        uses: ./.github/actions/setup-node
      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache universal macOS dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          shared-key: release-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install desktop and runtime dependencies
        run: |
          npm ci
          npm ci --prefix synara
      - name: Build unsigned universal executable
        run: npm run tauri build -- --target universal-apple-darwin --no-bundle --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

  ios-device:
    if: inputs.family == 'ios-device'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned Apple toolchain
        run: test "$(xcodebuild -version)" = $'Xcode 26.6\nBuild version 17F113'
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install Rust 1.96 and Apple targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96
          components: llvm-tools-preview
          targets: aarch64-apple-ios
      - name: Cache Apple device dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target/synara-core-apple
            . -> target/synara-core-bindgen
          env-vars: DEVELOPER_DIR
          shared-key: release-synara-core-apple-device
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Generate and validate device bindings and archives
        run: |
          scripts/generate-synara-core-swift.sh
          scripts/generate-synara-nse-core-swift.sh
        env:
          SYNARA_CORE_APPLE_SLICES: device
          SYNARA_NSE_CORE_APPLE_SLICES: device
