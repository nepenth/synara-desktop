# All production Rust packages share dependency resolution and build output.
# Build Apple packages separately to preserve their production feature graphs.
[workspace]
resolver = "2"
members = [
  "crates/synara-core",
  "crates/synara-core-bindgen",
  "crates/synara-nse-core",
  "src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "AGPL-3.0-only"
authors = ["Synara contributors"]
repository = "https://github.com/nepenth/synara-desktop"
publish = false

# Versions and default-feature policy live here; each package explicitly adds
# only the capabilities required by its own production or test graph.
[workspace.dependencies]
# Generates the renderer's TypeScript wire types; only built with `ts-export`.
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat", "serde-json-impl"] }
serde = "1.0.193"
serde_json = "1.0.109"
url = "2"
reqwest = { version = "0.13", default-features = false }
tokio = "1"
matrix-sdk = { version = "=0.19.1", default-features = false }
matrix-sdk-ui = { version = "=0.19.1", default-features = false }
matrix-sdk-crypto = { version = "=0.19.1", default-features = false }
matrix-sdk-sqlite = { version = "=0.19.1", default-features = false }
# Match the SDK backend to inspect SQLite result codes without text heuristics.
rusqlite = { version = "=0.40.2", default-features = false }
matrix-sdk-test = "=0.19.1"
ruma = "=0.17.0"
eyeball-im = "0.9"
futures-util = "0.3"
getrandom = "0.4"
# Runtime/scaffolding do not need Cargo metadata discovery. The project-owned
# generator explicitly enables it alongside its CLI feature.
uniffi = { version = "=0.32.2", default-features = false }
sha2 = "0.11"
hmac = "0.13"
zeroize = "1"
mime = "0.3"
rustls = { version = "0.23.45", default-features = false }

# Apple's notification service extension has a strict memory ceiling. Build
# its complete dependency graph for size and cross-crate dead-code elimination
# without changing the normal desktop/full-Core release profile.
[profile.nse-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
