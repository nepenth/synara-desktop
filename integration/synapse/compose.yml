name: synara-integration

services:
  postgres:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${SYNARA_POSTGRES_PASSWORD:?generated by scripts/synapse-integration.sh}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  synapse:
    image: matrixdotorg/synapse:v1.156.0
    restart: unless-stopped
    environment:
      UID: ${SYNARA_UID:?generated by scripts/synapse-integration.sh}
      GID: ${SYNARA_GID:?generated by scripts/synapse-integration.sh}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SYNARA_PORT:-8008}:8008"
    volumes:
      - ./runtime:/data
      - ./log.config:/data/log.config:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  postgres-data:
