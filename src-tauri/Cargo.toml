# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
publish.workspace = true
name = "synara"
version = "2.1.44"
description = "A modern Matrix client"
authors.workspace = true
license.workspace = true
repository.workspace = true
default-run = "synara"
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# Matrix DTOs and policy live in the shared native core. Default features
# include full-uniffi → room-key-forwarding (desktop compile-in). Search index
# and X.509 identity are desktop-only; NSE / iOS SharedCore must not enable them.
synara-core = { path = "../crates/synara-core", version = "0.1.0", features = [
  "search-index",
  "x509-identity",
] }
keyring = { version = "3.6.3", default-features = false, features = [
  "apple-native",
  "linux-native-sync-persistent",
  "crypto-rust",
] }
tauri = { version = "~2.12.1", features = ["tray-icon", "image-png"] }
getrandom = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
regex = "1"
rfd = "0.17.2"
# R0.7: live CS-API discovery/login-types transports (read-only; no login).
reqwest = { workspace = true, features = [
  "rustls",
  "http2",
  "stream",
] }
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
url = { workspace = true }
mime = { workspace = true }
# P1.2 + P2.3: Matrix Rust SDK exact pin (program: matrix-sdk-0.19.1 @ b18166c6…).
# default-features=false; approved features only (sqlite + bundled-sqlite for desktop stores).
# rustls-aws-lc-rs is required with default-features=false so rustls has a crypto
# provider (0.19.0 breaking change; previously arrived via reqwest's rustls default).
# matrix-sdk-ui transitively enables matrix-sdk/e2e-encryption via feature unification.
# automatic-room-key-forwarding is a desktop/full-app compile-in (also via Core
# `room-key-forwarding`); NSE must not enable it.
matrix-sdk = { workspace = true, features = [
  "sqlite",
  "bundled-sqlite",
  "rustls-aws-lc-rs",
  # SDK capability features (2026-08-10 best-practice pass):
  # - markdown: timeline/event formatting (ruma/markdown)
  # - qrcode: QR verification (also enables e2e-encryption, already on via
  #   matrix-sdk-ui feature unification)
  "markdown",
  "qrcode",
  "unstable-msc4426",
  "automatic-room-key-forwarding",
  # Experimental widget host compile pin. Runtime enablement is a separate
  # in-client setting (default off). Do not add experimental-send-custom-to-device
  # here; it arrives transitively via experimental-widgets.
  "experimental-widgets",
  # Desktop-only local message index. Do not enable on NSE / iOS SharedCore.
  "experimental-search",
  "experimental-encrypted-state-events",
] }
matrix-sdk-ui = { workspace = true, features = [
  "rustls-aws-lc-rs",
  "experimental-encrypted-state-events",
] }
matrix-sdk-crypto = { workspace = true, features = [
  "automatic-room-key-forwarding",
] }
eyeball-im = { workspace = true }
futures-util = { workspace = true }
# Runtime for Matrix client open/drop (also used by matrix-sdk). Kept direct so
# SdkClientHandle can shut down SQLite pools outside an ambient async context.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]
devtools = [ "tauri/devtools" ]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "~2.13.1"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.4.5"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.17"
webkit2gtk = { version = "2.0.2", features = ["v2_16"] }
zbus = "5.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.12"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSSound", "NSWindow"] }
# Delivery receipt for the legacy NSUserNotificationCenter path that
# `mac-notification-sys` posts through (see `desktop_notifications.rs`).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSDictionary", "NSError", "NSEnumerator", "NSObject", "NSSet", "NSString", "NSUserNotification"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "block2"] }
block2 = "0.6"
security-framework = "3.7"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
rusqlite = { workspace = true }
hmac = "0.13"
sha1 = "0.11"
hex = "0.4"
matrix-sdk = { workspace = true, features = [
  "testing",
  "sqlite",
  "bundled-sqlite",
  "rustls-aws-lc-rs",
  "markdown",
  "qrcode",
  "experimental-search",
  "experimental-encrypted-state-events",
] }
matrix-sdk-test = { workspace = true }
